<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .tilt{transform-box:fill-box;transform-origin:50% 100%;animation:tilt 5s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:rotate(0)}25%,60%{transform:rotate(-7deg)}80%{transform:rotate(2deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 5s ease-in-out infinite}
    @keyframes ear{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}30%{transform:rotate(4deg)}40%{transform:rotate(-12deg)}55%,75%{transform:rotate(-8deg)}}
    .wave{animation:wave 2.4s ease-out infinite;opacity:0}
    .w2{animation-delay:.6s}
    .w3{animation-delay:1.2s}
    @keyframes wave{0%{transform:translateX(-30px);opacity:0}25%{opacity:.85}100%{transform:translateX(26px);opacity:0}}
    .spark{transform-box:fill-box;transform-origin:50% 50%;animation:spark 5s ease-out infinite;opacity:0}
    @keyframes spark{0%,55%{transform:scale(.2) rotate(0);opacity:0}68%{transform:scale(1.2) rotate(45deg);opacity:1}85%{transform:scale(1) rotate(60deg);opacity:.9}100%{transform:scale(.4) rotate(90deg);opacity:0}}
    .tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 3.6s ease-in-out infinite;opacity:0}
    .t2{animation-delay:1.5s}
    @keyframes tw{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:.8}}
    .breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3s ease-in-out infinite}
    @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.02,1.03)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1efe6"/>
      <stop offset="55%" stop-color="#ecf2ee"/>
      <stop offset="100%" stop-color="#fbe3ec"/>
    </linearGradient>
    <clipPath id="hc"><ellipse cx="0" cy="0" rx="39" ry="34"/></clipPath>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <text x="540" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="80" letter-spacing="6" fill="#1e3a4a">直感に耳を傾ける</text>
  <g fill="none" stroke="#fb7185" stroke-width="3.5" stroke-linecap="round">
    <path class="wave" d="M 1000 82 Q 1010 100 1000 118"/>
    <path class="wave w2" d="M 1000 72 Q 1017 100 1000 128"/>
    <path class="wave w3" d="M 1000 62 Q 1024 100 1000 138"/>
  </g>
  <g fill="#14b8a6">
    <path class="tw" d="M 975 28 L 978 36 L 986 39 L 978 42 L 975 50 L 972 42 L 964 39 L 972 36 Z"/>
    <path class="tw t2" d="M 1175 26 L 1178 34 L 1186 37 L 1178 40 L 1175 48 L 1172 40 L 1164 37 L 1172 34 Z"/>
  </g>
  <g transform="translate(1100,112)">
    <g class="tilt">
      <g class="ear"><polygon points="-33,-14 -31,-50 -8,-28" fill="#1f2937"/></g>
      <polygon points="33,-14 29,-46 9,-28" fill="#1f2937"/>
      <polygon points="-27,-19 -27,-40 -15,-27" fill="#fda4af"/>
      <polygon points="28,-19 27,-38 15,-27" fill="#fda4af"/>
      <ellipse cx="0" cy="0" rx="39" ry="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <g clip-path="url(#hc)">
        <circle cx="-30" cy="-22" r="27" fill="#1f2937"/>
        <circle cx="30" cy="-22" r="27" fill="#1f2937"/>
        <polygon points="0,-36 -7,-4 7,-4" fill="#ffffff"/>
      </g>
      <path d="M -22 -2 Q -14 5 -6 -2 M 6 -2 Q 14 5 22 -2" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-25" cy="9" rx="6" ry="3.5" fill="#fda4af" opacity=".7"/>
      <ellipse cx="25" cy="9" rx="6" ry="3.5" fill="#fda4af" opacity=".7"/>
      <polygon points="-4,7 4,7 0,12" fill="#f472b6"/>
      <path d="M 0 12 Q -5 19 -10 16 M 0 12 Q 5 19 10 16" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
      <g stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round">
        <path d="M -46 8 L -22 11 M -46 18 L -22 16"/>
        <path d="M 46 8 L 22 11 M 46 18 L 22 16"/>
      </g>
    </g>
  </g>
  <path class="spark" fill="#f59e0b" d="M 1100 16 L 1104 28 L 1116 32 L 1104 36 L 1100 48 L 1096 36 L 1084 32 L 1096 28 Z"/>
</svg>
