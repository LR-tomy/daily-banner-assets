<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.7s ease-out infinite;opacity:0}
    .r2{animation-delay:.9s}
    .r3{animation-delay:1.8s}
    @keyframes ring{0%{transform:scale(.3);opacity:.85}100%{transform:scale(3.2);opacity:0}}
    .dot{transform-box:fill-box;transform-origin:50% 50%;animation:dot 2.7s ease-in-out infinite}
    @keyframes dot{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
    .vf{transform-box:fill-box;transform-origin:50% 50%;animation:vf 2.7s ease-in-out infinite}
    @keyframes vf{0%,100%{transform:scale(1.35)}50%{transform:scale(1)}}
    .breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3.2s ease-in-out infinite}
    @keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
    .head{transform-box:fill-box;transform-origin:70% 100%;animation:head 5.4s ease-in-out infinite}
    @keyframes head{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 3.6s ease-in-out infinite}
    @keyframes tail{0%,100%{transform:rotate(0)}40%{transform:rotate(7deg)}60%{transform:rotate(-3deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 6s ease-in-out infinite}
    @keyframes ear{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-14deg)}96%{transform:rotate(2deg)}}
    .blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
    @keyframes blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <text x="470" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="68" letter-spacing="4" fill="#292524">イマココに集中すべし！</text>
  <!-- focus point -->
  <g>
    <circle class="ring" cx="940" cy="75" r="14" fill="none" stroke="#dc2626" stroke-width="3"/>
    <circle class="ring r2" cx="940" cy="75" r="14" fill="none" stroke="#dc2626" stroke-width="3"/>
    <circle class="ring r3" cx="940" cy="75" r="14" fill="none" stroke="#dc2626" stroke-width="3"/>
    <g class="vf" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 910 55 L 910 45 L 920 45"/>
      <path d="M 960 45 L 970 45 L 970 55"/>
      <path d="M 970 95 L 970 105 L 960 105"/>
      <path d="M 920 105 L 910 105 L 910 95"/>
    </g>
    <circle class="dot" cx="940" cy="75" r="9" fill="#dc2626"/>
  </g>
  <!-- sitting cat facing left -->
  <g transform="translate(1085,146) scale(1.15)">
    <path class="tail" d="M 24 -6 Q 52 -6 50 -32 Q 49 -46 41 -44" fill="none" stroke="#3f3f46" stroke-width="8" stroke-linecap="round"/>
    <g class="breath">
      <ellipse cx="6" cy="-26" rx="21" ry="27" fill="#3f3f46" transform="rotate(-8 6 -26)"/>
      <ellipse cx="14" cy="-12" rx="15" ry="12" fill="#ea8a2e"/>
      <ellipse cx="-3" cy="-26" rx="8" ry="16" fill="#fafaf9"/>
      <rect x="-17" y="-24" width="8" height="24" rx="4" fill="#3f3f46"/>
      <rect x="-17.5" y="-8" width="9" height="8" rx="4" fill="#fafaf9"/>
    </g>
    <g class="head">
      <polygon points="-26,-70 -24,-88 -13,-74" fill="#ea8a2e"/>
      <g class="ear"><polygon points="-9,-74 -2,-86 4,-68" fill="#3f3f46"/></g>
      <circle cx="-12" cy="-60" r="16" fill="#3f3f46"/>
      <path d="M -12 -76 A 16 16 0 0 0 -28 -60 L -12 -60 Z" fill="#ea8a2e"/>
      <ellipse cx="-24" cy="-55" rx="7" ry="6" fill="#fafaf9"/>
      <circle cx="-30" cy="-58" r="2" fill="#f472b6"/>
      <g class="blink"><ellipse cx="-19" cy="-62" rx="2.2" ry="3.2" fill="#fde047"/><ellipse cx="-19.6" cy="-62" rx="1" ry="2.6" fill="#0c0a09"/></g>
      <g stroke="#fafaf9" stroke-width="1.3" stroke-linecap="round" opacity=".95">
        <path d="M -23 -55 L -6 -50"/><path d="M -23 -57 L -4 -57"/><path d="M -23 -59 L -6 -64"/>
      </g>
    </g>
  </g>
</svg>
