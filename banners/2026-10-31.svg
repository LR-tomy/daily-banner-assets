<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .hop{animation:hop 7s ease-in-out infinite}
    @keyframes hop{
      0%{transform:translate(868px,140px);opacity:0}
      4%,16%{transform:translate(868px,140px);opacity:1}
      19%{transform:translate(911px,98px)}
      22%,34%{transform:translate(955px,116px)}
      37%{transform:translate(1000px,72px)}
      40%,52%{transform:translate(1045px,92px)}
      55%{transform:translate(1094px,48px)}
      58%,88%{transform:translate(1143px,68px);opacity:1}
      95%{transform:translate(1143px,68px);opacity:0}
      100%{transform:translate(868px,140px);opacity:0}
    }
    .leg{transform-box:fill-box;transform-origin:50% 0%;animation:leg 7s ease-in-out infinite}
    .lf{animation-name:legf}
    @keyframes leg{0%,17%{transform:rotate(0)}19%{transform:rotate(42deg)}22%,35%{transform:rotate(0)}37%{transform:rotate(42deg)}40%,53%{transform:rotate(0)}55%{transform:rotate(42deg)}58%,100%{transform:rotate(0)}}
    @keyframes legf{0%,17%{transform:rotate(0)}19%{transform:rotate(-42deg)}22%,35%{transform:rotate(0)}37%{transform:rotate(-42deg)}40%,53%{transform:rotate(0)}55%{transform:rotate(-42deg)}58%,100%{transform:rotate(0)}}
    .tail{transform-box:fill-box;transform-origin:100% 100%;animation:tail 1.2s ease-in-out infinite}
    @keyframes tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
    .blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 3.5s infinite}
    @keyframes blink{0%,86%,92%,100%{transform:scaleY(1)}89%{transform:scaleY(.1)}}
    .badge{transform-box:fill-box;transform-origin:50% 50%;animation:badge 7s ease-out infinite;opacity:0;transform:scale(0)}
    @keyframes badge{0%,60%{transform:scale(0);opacity:0}63%{transform:scale(1.3);opacity:1}67%,90%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="55%" stop-color="#d9f2f5"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <text x="420" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="72" letter-spacing="4" fill="#312e81">マイルールの改善！</text>
  <!-- stairs -->
  <g fill="#fff7ed" stroke="#a5b4fc" stroke-width="3" stroke-linejoin="round">
    <rect x="820" y="140" width="90" height="14"/>
    <rect x="910" y="116" width="90" height="38"/>
    <rect x="1000" y="92" width="90" height="62"/>
    <rect x="1090" y="68" width="116" height="86"/>
  </g>
  <!-- badge -->
  <g class="badge">
    <circle cx="1075" cy="42" r="17" fill="#ffffff" stroke="#f43f5e" stroke-width="3"/>
    <path d="M 1066 42 L 1073 49 L 1085 35" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- white cat facing right -->
  <g class="hop">
    <g transform="scale(.75)">
      <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
        <g transform="translate(-14,-20)"><g class="leg"><rect x="-3" y="0" width="6" height="20" rx="3"/></g></g>
        <g transform="translate(15,-20)"><g class="leg lf"><rect x="-3" y="0" width="6" height="20" rx="3"/></g></g>
      </g>
      <path class="tail" d="M -27 -28 Q -54 -26 -52 -48 Q -51 -60 -43 -58" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
      <path class="tail" d="M -27 -28 Q -54 -26 -52 -48 Q -51 -60 -43 -58" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="0" cy="-27" rx="31" ry="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
        <g transform="translate(-18,-20)"><g class="leg lf"><rect x="-3" y="0" width="6" height="20" rx="3"/></g></g>
        <g transform="translate(22,-20)"><g class="leg"><rect x="-3" y="0" width="6" height="20" rx="3"/></g></g>
      </g>
      <polygon points="37,-50 45,-62 48,-45" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="23,-46 27,-62 38,-51" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="27,-49 28,-58 34,-51" fill="#fbcfe8"/>
      <circle cx="35" cy="-37" r="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <ellipse cx="14" cy="-27" rx="30" ry="13" fill="#ffffff"/>
      <circle cx="35" cy="-37" r="12" fill="#ffffff"/>
      <circle cx="48" cy="-35" r="1.9" fill="#f472b6"/>
      <g class="blink"><ellipse cx="39" cy="-40" rx="1.9" ry="2.8" fill="#0369a1"/></g>
      <path d="M 46 -31 q -2 3 -5 2" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round">
        <path d="M 41 -32 L 26 -26"/><path d="M 41 -34 L 24 -33"/><path d="M 41 -36 L 26 -40"/>
      </g>
    </g>
  </g>
</svg>
