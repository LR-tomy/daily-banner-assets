<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .st{animation:st 1s linear infinite;stroke:#a5b4fc;stroke-width:3;stroke-linecap:round;opacity:.55}
    @keyframes st{0%{transform:translateX(-260px)}100%{transform:translateX(1300px)}}
    .float{animation:float 4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .gem{transform-box:fill-box;transform-origin:50% 50%;animation:spin 6s ease-in-out infinite}
    @keyframes spin{0%,100%{transform:scaleX(1)}25%{transform:scaleX(.3)}50%{transform:scaleX(1)}75%{transform:scaleX(.3)}}
    .halo{transform-box:fill-box;transform-origin:50% 50%;animation:halo 3s ease-in-out infinite}
    @keyframes halo{0%,100%{transform:scale(.9);opacity:.35}50%{transform:scale(1.1);opacity:.6}}
    .glint{transform-box:fill-box;transform-origin:50% 50%;animation:glint 3s ease-in-out infinite;opacity:0}
    @keyframes glint{0%,60%,100%{transform:scale(0) rotate(0deg);opacity:0}75%{transform:scale(1) rotate(45deg);opacity:1}}
    .breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3.4s ease-in-out infinite}
    @keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
    .head{transform-box:fill-box;transform-origin:75% 100%;animation:head 6s ease-in-out infinite}
    @keyframes head{0%,100%{transform:rotate(7deg)}50%{transform:rotate(13deg)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 3.6s ease-in-out infinite}
    @keyframes tail{0%,100%{transform:rotate(0)}40%{transform:rotate(7deg)}60%{transform:rotate(-3deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 6s ease-in-out infinite}
    @keyframes ear{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-14deg)}96%{transform:rotate(2deg)}}
    .blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
    @keyframes blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="gm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
      <radialGradient id="hl"><stop offset="0%" stop-color="#67e8f9" stop-opacity=".85"/><stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <line class="st" style="animation-duration:1.0s;animation-delay:-0s" x1="0" y1="18" x2="160" y2="18"/>
    <line class="st" style="animation-duration:1.4s;animation-delay:-0.3s" x1="0" y1="44" x2="220" y2="44"/>
    <line class="st" style="animation-duration:0.9s;animation-delay:-0.5s" x1="0" y1="96" x2="140" y2="96"/>
    <line class="st" style="animation-duration:1.2s;animation-delay:-0.1s" x1="0" y1="122" x2="200" y2="122"/>
    <line class="st" style="animation-duration:0.8s;animation-delay:-0.7s" x1="0" y1="140" x2="120" y2="140"/>
    <line class="st" style="animation-duration:1.1s;animation-delay:-0.9s" x1="0" y1="70" x2="100" y2="70"/>
    
  <text x="400" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="80" letter-spacing="6" fill="#1e1b4b">速度より本質！</text>
  <!-- essence gem -->
  <circle class="halo" cx="940" cy="62" r="56" fill="url(#hl)"/>
  <g transform="translate(940,62) scale(1.3)"><g class="float">
    <g class="gem">
      <path d="M -26 -10 L -14 -26 L 14 -26 L 26 -10 L 0 28 Z" fill="url(#gm)" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M -26 -10 L 26 -10 M -14 -26 L -7 -10 L 0 28 M 14 -26 L 7 -10 L 0 28" fill="none" stroke="#ecfeff" stroke-width="1.8" stroke-linejoin="round" opacity=".85"/>
    </g>
    <g class="glint"><path d="M -14 -22 l 2 -8 l 2 8 l 8 2 l -8 2 l -2 8 l -2 -8 l -8 -2 z" fill="#ffffff"/></g>
  </g></g>
  <!-- ruddy cat facing left -->
  <g transform="translate(1100,146) scale(1.1)">
    <path class="tail" d="M 24 -6 Q 52 -6 50 -32 Q 49 -46 41 -44" fill="none" stroke="#b5651d" stroke-width="8" stroke-linecap="round"/>
    <g class="breath">
      <ellipse cx="6" cy="-26" rx="21" ry="27" fill="#b5651d" transform="rotate(-8 6 -26)"/>
      <ellipse cx="14" cy="-12" rx="15" ry="12" fill="#a05518"/>
      <ellipse cx="-3" cy="-26" rx="8" ry="16" fill="#f1c9a0"/>
      <rect x="-17" y="-24" width="8" height="24" rx="4" fill="#b5651d"/>
      <rect x="-17.5" y="-8" width="9" height="8" rx="4" fill="#8a4513"/>
      <g stroke="#7c3a10" stroke-width="1.6" stroke-linecap="round" opacity=".7">
        <path d="M 8 -44 l 2 5"/><path d="M 14 -40 l 2 5"/><path d="M 18 -30 l 3 3"/><path d="M 12 -22 l 3 2"/><path d="M 4 -36 l 1 5"/>
      </g>
    </g>
    <g class="head">
      <polygon points="-26,-70 -24,-88 -13,-74" fill="#8a4513"/>
      <g class="ear"><polygon points="-9,-74 -2,-86 4,-68" fill="#b5651d"/></g>
      <polygon points="-22,-72 -21,-83 -15,-74" fill="#f9a8d4"/>
      <circle cx="-12" cy="-60" r="16" fill="#b5651d"/>
      <ellipse cx="-24" cy="-55" rx="7" ry="6" fill="#f1c9a0"/>
      <circle cx="-30" cy="-58" r="2" fill="#f472b6"/>
      <g class="blink"><ellipse cx="-19" cy="-62" rx="2.4" ry="3.3" fill="#fbbf24"/><ellipse cx="-19.7" cy="-62" rx="1" ry="2.6" fill="#0c0a09"/></g>
      <g stroke="#fff7ed" stroke-width="1.3" stroke-linecap="round" opacity=".95">
        <path d="M -23 -55 L -6 -50"/><path d="M -23 -57 L -4 -57"/><path d="M -23 -59 L -6 -64"/>
      </g>
    </g>
  </g>
</svg>
