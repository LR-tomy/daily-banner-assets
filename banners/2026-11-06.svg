<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fall{animation:fall 9s linear infinite}
    @keyframes fall{0%{transform:translateY(0)}100%{transform:translateY(176px)}}
    .sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes sway{0%,100%{transform:translateX(-14px) rotate(-30deg)}50%{transform:translateX(14px) rotate(35deg)}}
    .bow{transform-box:view-box;transform-origin:0px 0px;animation:bow 6s ease-in-out infinite}
    @keyframes bow{0%,12%{transform:rotate(0)}38%,58%{transform:rotate(27deg)}84%,100%{transform:rotate(0)}}
    .eye{transform-box:fill-box;transform-origin:50% 50%;animation:eye 6s ease-in-out infinite}
    @keyframes eye{0%,12%,84%,100%{transform:scaleY(1)}30%,64%{transform:scaleY(.12)}}
    .tail{animation:tail 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
    @keyframes tail{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(7deg)}}
    .glow{animation:glow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes glow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.25)}}
    .seal{animation:seal 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes seal{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    .ear{animation:ear 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
    @keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-8deg)}97%{transform:rotate(2deg)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/><stop offset="55%" stop-color="#ffeede"/><stop offset="100%" stop-color="#fde4e1"/>
    </linearGradient>
    <radialGradient id="gl"><stop offset="0%" stop-color="#fde68a" stop-opacity=".9"/><stop offset="100%" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <g transform="translate(205,-14)"><g class="fall" style="animation-duration:8.9s;animation-delay:-2.3s"><g class="sway" style="animation-duration:3.4s"><ellipse rx="4.2" ry="2.4" fill="#f9c5c0" opacity=".85"/></g></g></g>
<g transform="translate(1003,-14)"><g class="fall" style="animation-duration:10.9s;animation-delay:-8.0s"><g class="sway" style="animation-duration:4.2s"><ellipse rx="5.2" ry="2.9" fill="#f9c5c0" opacity=".85"/></g></g></g>
<g transform="translate(84,-14)"><g class="fall" style="animation-duration:8.1s;animation-delay:-6.5s"><g class="sway" style="animation-duration:3.1s"><ellipse rx="6.4" ry="3.6" fill="#f9c5c0" opacity=".85"/></g></g></g>
<g transform="translate(887,-14)"><g class="fall" style="animation-duration:10.6s;animation-delay:-5.7s"><g class="sway" style="animation-duration:4.1s"><ellipse rx="4.5" ry="2.5" fill="#f9c5c0" opacity=".85"/></g></g></g>
<g transform="translate(583,-14)"><g class="fall" style="animation-duration:9.7s;animation-delay:-5.9s"><g class="sway" style="animation-duration:3.7s"><ellipse rx="4.5" ry="2.5" fill="#f9c5c0" opacity=".85"/></g></g></g>
<g transform="translate(909,-14)"><g class="fall" style="animation-duration:8.3s;animation-delay:-0.8s"><g class="sway" style="animation-duration:3.2s"><ellipse rx="6.6" ry="3.7" fill="#f9c5c0" opacity=".85"/></g></g></g>
<g transform="translate(552,-14)"><g class="fall" style="animation-duration:8.8s;animation-delay:-0.8s"><g class="sway" style="animation-duration:3.4s"><ellipse rx="4.8" ry="2.7" fill="#f9c5c0" opacity=".85"/></g></g></g>
<g transform="translate(636,-14)"><g class="fall" style="animation-duration:7.4s;animation-delay:-0.3s"><g class="sway" style="animation-duration:2.8s"><ellipse rx="6.9" ry="3.9" fill="#f9c5c0" opacity=".85"/></g></g></g>
<g transform="translate(778,-14)"><g class="fall" style="animation-duration:8.9s;animation-delay:-7.5s"><g class="sway" style="animation-duration:3.4s"><ellipse rx="4.8" ry="2.7" fill="#f9c5c0" opacity=".85"/></g></g></g>

  <text x="400" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="80" letter-spacing="4" fill="#3d2c3e">真摯に対応</text>
  <!-- cushion -->
  <rect x="930" y="132" width="190" height="16" rx="8" fill="#e9a6a1"/>
  <rect x="936" y="134" width="178" height="4" rx="2" fill="#f3c2bd"/>
  <!-- envelope -->
  <g transform="translate(1086,122)">
    <circle class="glow" cx="0" cy="0" r="26" fill="url(#gl)"/>
    <rect x="-17" y="-10" width="34" height="22" rx="3" fill="#fffdf7" stroke="#d6c7a8" stroke-width="2"/>
    <path d="M -17 -8 L 0 4 L 17 -8" fill="none" stroke="#d6c7a8" stroke-width="2" stroke-linejoin="round"/>
    <path class="seal" d="M 0 8 C -6 2 -6 -2 0 0 C 6 -2 6 2 0 8 Z" transform="translate(0,-1)" fill="#e11d48"/>
  </g>
  <!-- cat sitting, bowing (faces right) -->
  <g transform="translate(1010,134) scale(1.15)">
    <path class="tail" d="M -34 -14 Q -58 -12 -56 -38 Q -55 -52 -46 -50" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-20" rx="28" ry="20" fill="#64748b"/>
    <rect x="22" y="-18" width="8" height="18" rx="4" fill="#7b8794"/>
    <rect x="34" y="-14" width="8" height="14" rx="4" fill="#8693a0"/>
    <g transform="translate(0,-18)">
      <g class="bow">
        <g transform="translate(0,18)">
          <ellipse cx="6" cy="-26" rx="22" ry="24" fill="#7b8794"/>
          <ellipse cx="14" cy="-14" rx="12" ry="10" fill="#e2e8f0"/>
          <polygon points="26,-62 34,-76 41,-58" fill="#64748b"/>
          <g class="ear"><polygon points="12,-60 14,-76 26,-62" fill="#7b8794"/></g>
          <polygon points="15,-62 16,-70 22,-63" fill="#fbcfe8"/>
          <circle cx="28" cy="-46" r="16" fill="#7b8794"/>
          <ellipse cx="39" cy="-41" rx="7" ry="5.5" fill="#cbd5e1"/>
          <circle cx="45" cy="-43" r="1.9" fill="#f472b6"/>
          <g class="eye"><ellipse cx="34" cy="-51" rx="2.2" ry="3.2" fill="#22c55e"/><ellipse cx="34.6" cy="-51" rx="1" ry="2.6" fill="#0f172a"/></g>
          <path d="M 42 -38 q -2 3 -5 2" fill="none" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
          <g stroke="#f8fafc" stroke-width="1.3" stroke-linecap="round" opacity=".95">
            <path d="M 37 -40 L 20 -34"/><path d="M 37 -42 L 18 -42"/><path d="M 37 -44 L 20 -50"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
