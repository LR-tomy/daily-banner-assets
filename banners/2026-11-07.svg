<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1{animation:hl 24s linear infinite}
    .h2{animation:hl 12s linear infinite}
    @keyframes hl{0%{transform:translateX(0)}100%{transform:translateX(-400px)}}
    .gr{stroke-dasharray:26 20;animation:gr .5s linear infinite}
    @keyframes gr{0%{stroke-dashoffset:0}100%{stroke-dashoffset:46}}
    .run{animation:run .5s ease-in-out infinite}
    @keyframes run{0%,100%{transform:translateY(0)}25%{transform:translateY(-6px)}50%{transform:translateY(0)}75%{transform:translateY(-6px)}}
    .leg{transform-box:fill-box;transform-origin:50% 0%;animation:st .5s ease-in-out infinite}
    .h{animation-delay:-.25s}
    @keyframes st{0%,100%{transform:rotate(-42deg)}50%{transform:rotate(42deg)}}
    .tail{transform-box:fill-box;transform-origin:100% 100%;animation:tl .5s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:er .5s ease-in-out infinite}
    @keyframes er{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-8deg)}}
    .blink{transform-box:fill-box;transform-origin:50% 50%;animation:bl 4s infinite}
    @keyframes bl{0%,86%,92%,100%{transform:scaleY(1)}89%{transform:scaleY(.1)}}
    .cloud{animation:cl 40s linear infinite}
    @keyframes cl{0%{transform:translateX(0)}100%{transform:translateX(-400px)}}
    .bub{transform-box:fill-box;transform-origin:50% 50%;animation:bb 5s ease-out infinite;opacity:0}
    @keyframes bb{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translate(-120px,-40px) scale(1.1);opacity:0}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/><stop offset="70%" stop-color="#e0f7fa"/><stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <g fill="#ffffff" opacity=".85"><g class="cloud">
    <ellipse cx="200" cy="26" rx="56" ry="10"/><ellipse cx="226" cy="19" rx="30" ry="10"/>
    <ellipse cx="640" cy="40" rx="48" ry="8"/><ellipse cx="662" cy="34" rx="26" ry="8"/>
    <ellipse cx="1000" cy="22" rx="60" ry="10"/><ellipse cx="1028" cy="15" rx="32" ry="10"/>
    <ellipse cx="1360" cy="26" rx="56" ry="10"/><ellipse cx="1386" cy="19" rx="30" ry="10"/>
  </g></g>
  <g class="h1" fill="#bfe3d6"><path d="M 0 150 L 0 104 Q 100.0 70 200.0 104 T 400 104 Q 500.0 70 600.0 104 T 800 104 Q 900.0 70 1000.0 104 T 1200 104 Q 1300.0 70 1400.0 104 T 1600 104 Q 1700.0 70 1800.0 104 T 2000 104 Q 2100.0 70 2200.0 104 T 2400 104 L 2400 150 Z"/></g>
  <g class="h2" fill="#9ed6bf"><path d="M 0 150 L 0 122 Q 50.0 104 100.0 122 T 200 122 Q 250.0 104 300.0 122 T 400 122 Q 450.0 104 500.0 122 T 600 122 Q 650.0 104 700.0 122 T 800 122 Q 850.0 104 900.0 122 T 1000 122 Q 1050.0 104 1100.0 122 T 1200 122 Q 1250.0 104 1300.0 122 T 1400 122 Q 1450.0 104 1500.0 122 T 1600 122 Q 1650.0 104 1700.0 122 T 1800 122 Q 1850.0 104 1900.0 122 T 2000 122 Q 2050.0 104 2100.0 122 T 2200 122 Q 2250.0 104 2300.0 122 T 2400 122 L 2400 150 Z"/></g>
  <text x="400" y="62" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="64" letter-spacing="3" fill="#0c4a6e">クリアな気持ちで前進！</text>
  <rect y="136" width="1200" height="14" fill="#d9f2e3"/>
  <line class="gr" x1="0" y1="140" x2="1200" y2="140" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#ffffff" stroke-width="2"><circle class="bub" cx="930" cy="96" r="6"/><circle class="bub" style="animation-delay:1.6s" cx="900" cy="110" r="4"/><circle class="bub" style="animation-delay:3.2s" cx="940" cy="84" r="5"/></g>
  <!-- calico cat running right -->
  <g transform="translate(1010,138) scale(1.25)">
    <g class="run">
      <g fill="#fffaf0" stroke="#e2d6c4" stroke-width="1">
        <g transform="translate(-14,-20)"><g class="leg"><rect x="-3" y="0" width="6" height="14" rx="3"/><rect x="-3.5" y="12" width="7" height="8" rx="3.5" fill="#f1e7d8"/></g></g>
        <g transform="translate(15,-20)"><g class="leg h"><rect x="-3" y="0" width="6" height="14" rx="3"/><rect x="-3.5" y="12" width="7" height="8" rx="3.5" fill="#f1e7d8"/></g></g>
      </g>
      <path class="tail" d="M -27 -28 Q -54 -24 -52 -46 Q -51 -58 -43 -56" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="0" cy="-27" rx="31" ry="14" fill="#fffaf0"/>
      <path d="M -22 -39 Q -4 -44 8 -38 Q 4 -30 -10 -28 Q -22 -28 -22 -39 Z" fill="#f59e0b"/>
      <path d="M 10 -40 Q 22 -38 26 -30 Q 18 -26 12 -30 Z" fill="#27272a"/>
      <g fill="#fffaf0" stroke="#e2d6c4" stroke-width="1">
        <g transform="translate(-18,-20)"><g class="leg h"><rect x="-3" y="0" width="6" height="14" rx="3"/><rect x="-3.5" y="12" width="7" height="8" rx="3.5"/></g></g>
        <g transform="translate(22,-20)"><g class="leg"><rect x="-3" y="0" width="6" height="14" rx="3"/><rect x="-3.5" y="12" width="7" height="8" rx="3.5"/></g></g>
      </g>
      <polygon points="37,-50 45,-62 48,-45" fill="#27272a"/>
      <g class="ear"><polygon points="23,-46 27,-62 38,-51" fill="#f59e0b"/></g>
      <polygon points="27,-49 28,-58 34,-51" fill="#fbcfe8"/>
      <circle cx="35" cy="-37" r="13" fill="#fffaf0"/>
      <path d="M 22 -40 Q 24 -50 35 -50 Q 31 -42 28 -34 Q 22 -34 22 -40 Z" fill="#f59e0b"/>
      <path d="M 38 -48 Q 46 -46 47 -39 Q 42 -38 38 -42 Z" fill="#27272a"/>
      <circle cx="48" cy="-35" r="1.9" fill="#f472b6"/>
      <g class="blink"><ellipse cx="40" cy="-40" rx="1.9" ry="2.8" fill="#0369a1"/></g>
      <path d="M 46 -31 q -2 3 -5 2" fill="none" stroke="#a8a29e" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#a8a29e" stroke-width="1.2" stroke-linecap="round">
        <path d="M 41 -32 L 26 -26"/><path d="M 41 -34 L 24 -33"/><path d="M 41 -36 L 26 -40"/>
      </g>
    </g>
  </g>
</svg>
