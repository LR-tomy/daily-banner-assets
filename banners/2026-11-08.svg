<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes sg0{0%,7%{opacity:0}14%,86%{opacity:1}94%,100%{opacity:0}}
    .sg0{animation:sg0 10s ease-in-out infinite;opacity:0}
    @keyframes sg1{0%,25%{opacity:0}32%,86%{opacity:1}94%,100%{opacity:0}}
    .sg1{animation:sg1 10s ease-in-out infinite;opacity:0}
    @keyframes sg2{0%,43%{opacity:0}50%,86%{opacity:1}94%,100%{opacity:0}}
    .sg2{animation:sg2 10s ease-in-out infinite;opacity:0}
    @keyframes sg3{0%,61%{opacity:0}68%,86%{opacity:1}94%,100%{opacity:0}}
    .sg3{animation:sg3 10s ease-in-out infinite;opacity:0}
    
    .br{animation:br 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
    @keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.07)}}
    .z{animation:z 4.8s ease-out infinite;opacity:0}
    @keyframes z{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}100%{transform:translate(16px,-44px);opacity:0}}
    .tail{animation:tl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}
    @keyframes tl{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(5deg)}}
    .ear{animation:er 8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
    @keyframes er{0%,92%,100%{transform:rotate(0)}95%{transform:rotate(-8deg)}98%{transform:rotate(2deg)}}
    .bolt{animation:bolt 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes bolt{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
    .glow{animation:gl 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes gl{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.15)}}
    .dust{animation:du 12s linear infinite}
    @keyframes du{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-120px);opacity:0}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/><stop offset="55%" stop-color="#f7fee7"/><stop offset="100%" stop-color="#ecfccb"/>
    </linearGradient>
    <radialGradient id="gl"><stop offset="0%" stop-color="#bef264" stop-opacity=".9"/><stop offset="100%" stop-color="#bef264" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <g fill="#d9f99d">
    <circle class="dust" cx="140" cy="150" r="4"/><circle class="dust" style="animation-delay:-4s" cx="560" cy="150" r="3"/>
    <circle class="dust" style="animation-delay:-8s" cx="820" cy="150" r="5"/><circle class="dust" style="animation-delay:-2s" cx="1180" cy="150" r="3"/>
  </g>
  <text x="400" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="80" letter-spacing="6" fill="#365314">静かにチャージ</text>
  <!-- battery -->
  <ellipse class="glow" cx="1105" cy="75" rx="62" ry="38" fill="url(#gl)"/>
  <rect x="1056" y="54" width="100" height="42" rx="8" fill="#ffffff" stroke="#65a30d" stroke-width="4"/>
  <rect x="1158" y="66" width="8" height="18" rx="3" fill="#65a30d"/>
  <rect class="sg0" x="1066" y="62" width="12" height="26" rx="2" fill="#84cc16"/><rect class="sg1" x="1081" y="62" width="12" height="26" rx="2" fill="#84cc16"/><rect class="sg2" x="1096" y="62" width="12" height="26" rx="2" fill="#84cc16"/><rect class="sg3" x="1111" y="62" width="12" height="26" rx="2" fill="#84cc16"/>
  <polygon class="bolt" points="1128,60 1118,78 1126,78 1122,92 1136,72 1128,72" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" transform="translate(-24,0)" opacity=".0"/>
  <!-- cushion -->
  <ellipse cx="960" cy="140" rx="86" ry="10" fill="#d9e8b0"/>
  <!-- sleeping tuxedo cat (faces right) -->
  <g transform="translate(956,136)">
    <path class="tail" d="M -42 -12 Q -68 -10 -64 -36 Q -63 -48 -55 -46" fill="none" stroke="#27272a" stroke-width="9" stroke-linecap="round"/>
    <g class="br">
      <ellipse cx="0" cy="-18" rx="48" ry="20" fill="#27272a"/>
      <ellipse cx="8" cy="-6" rx="28" ry="9" fill="#fafaf9"/>
    </g>
    <polygon points="48,-34 54,-48 61,-30" fill="#18181b"/>
    <g class="ear"><polygon points="32,-32 35,-48 46,-34" fill="#27272a"/></g>
    <polygon points="35,-35 36,-43 42,-36" fill="#fbcfe8" opacity=".8"/>
    <circle cx="48" cy="-18" r="17" fill="#27272a"/>
    <ellipse cx="58" cy="-11" rx="9" ry="7" fill="#fafaf9"/>
    <circle cx="65" cy="-14" r="2" fill="#f472b6"/>
    <path d="M 46 -22 q 5 4 10 0" fill="none" stroke="#fafaf9" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#a1a1aa" stroke-width="1.3" stroke-linecap="round">
      <path d="M 55 -10 L 40 -5"/><path d="M 55 -12 L 38 -12"/><path d="M 55 -14 L 40 -19"/>
    </g>
    <ellipse cx="46" cy="-1" rx="8" ry="4" fill="#fafaf9"/><ellipse cx="30" cy="0" rx="7" ry="3.5" fill="#fafaf9"/>
  </g>
  <text class="z" style="animation-delay:0.0s" x="1012" y="100" font-family="Georgia,serif" font-weight="700" font-size="16" fill="#9aae6a">z</text><text class="z" style="animation-delay:1.6s" x="1018" y="100" font-family="Georgia,serif" font-weight="700" font-size="19" fill="#9aae6a">z</text><text class="z" style="animation-delay:3.2s" x="1024" y="100" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#9aae6a">z</text>
</svg>
