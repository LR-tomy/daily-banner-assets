<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .go{animation:go 8s ease-in-out infinite}
    @keyframes go{
      0%{transform:translate(924px,138px);opacity:0}
      4%,12%{transform:translate(924px,138px);opacity:1}
      40%{transform:translate(986px,138px)}
      86%{transform:translate(986px,138px);opacity:1}
      94%,100%{transform:translate(986px,138px);opacity:0}
    }
    .bob{animation:bob 8s ease-in-out infinite}
    @keyframes bob{0%,12%,40%,100%{transform:translateY(0)}24%{transform:translateY(-4px)}}
    .lg{transform-box:fill-box;transform-origin:50% 0%}
    .fn{animation:fn 8s ease-in-out infinite}
    @keyframes fn{0%,12%{transform:rotate(0)}24%{transform:rotate(-48deg)}32%{transform:rotate(-30deg)}40%,100%{transform:rotate(0)}}
    .hn{animation:hn 8s ease-in-out infinite}
    @keyframes hn{0%,18%{transform:rotate(0)}30%{transform:rotate(-34deg)}40%,100%{transform:rotate(0)}}
    .ff{animation:ff 8s ease-in-out infinite}
    @keyframes ff{0%,16%{transform:rotate(0)}28%{transform:rotate(-20deg)}40%,100%{transform:rotate(0)}}
    .hf{animation:hf 8s ease-in-out infinite}
    @keyframes hf{0%,14%{transform:rotate(0)}26%{transform:rotate(-14deg)}40%,100%{transform:rotate(0)}}
    .tail{transform-box:fill-box;transform-origin:100% 100%;animation:tl 8s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(-4deg)}30%{transform:rotate(10deg)}60%{transform:rotate(-2deg)}}
    .blink{transform-box:fill-box;transform-origin:50% 50%;animation:bl 4s infinite}
    @keyframes bl{0%,86%,92%,100%{transform:scaleY(1)}89%{transform:scaleY(.1)}}
    .print{transform-box:fill-box;transform-origin:50% 50%;animation:pr 8s ease-out infinite;opacity:0}
    @keyframes pr{0%,36%{transform:scale(.3);opacity:0}42%{transform:scale(1.2);opacity:1}48%,84%{transform:scale(1);opacity:.9}94%,100%{transform:scale(1);opacity:0}}
    .puff{transform-box:fill-box;transform-origin:50% 50%;animation:pf 8s ease-out infinite;opacity:0}
    .p2{animation-delay:.12s}
    @keyframes pf{0%,38%{transform:translate(0,0) scale(.3);opacity:0}42%{opacity:.8}60%,100%{transform:translate(var(--dx,12px),-10px) scale(1.4);opacity:0}}
    .sprout{transform-box:fill-box;transform-origin:50% 100%;animation:sp 8s ease-out infinite;opacity:0}
    @keyframes sp{0%,44%{transform:scale(0);opacity:0}58%{transform:scale(1.1);opacity:1}64%,84%{transform:scale(1);opacity:1}94%,100%{transform:scale(1);opacity:0}}
    .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite}
    @keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
    .cloud{animation:cl 50s linear infinite}
    @keyframes cl{0%{transform:translateX(0)}100%{transform:translateX(-400px)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ef"/><stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <g fill="#ffffff" opacity=".9"><g class="cloud">
    <ellipse cx="180" cy="28" rx="54" ry="9"/><ellipse cx="206" cy="21" rx="28" ry="9"/>
    <ellipse cx="620" cy="40" rx="46" ry="8"/><ellipse cx="640" cy="34" rx="24" ry="8"/>
    <ellipse cx="1000" cy="24" rx="58" ry="9"/><ellipse cx="1026" cy="17" rx="30" ry="9"/>
    <ellipse cx="1380" cy="28" rx="54" ry="9"/><ellipse cx="1406" cy="21" rx="28" ry="9"/>
  </g></g>
  <text x="400" y="62" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="80" letter-spacing="4" fill="#0f766e">一歩を踏み出す</text>
  <path d="M 0 140 Q 300 132 600 140 T 1200 138 L 1200 150 L 0 150 Z" fill="#e7d9c3"/>
  <path d="M 700 140 Q 900 138 1200 140" stroke="#d3c1a1" stroke-width="3" fill="none" stroke-dasharray="14 12" stroke-linecap="round"/>
  <!-- footprint + sprout left behind -->
  <g transform="translate(918,140)">
    <g class="print" fill="#fb7185"><ellipse cx="0" cy="-2" rx="6" ry="4.5"/><circle cx="-7" cy="-9" r="2.4"/><circle cx="-2.5" cy="-12" r="2.4"/><circle cx="2.5" cy="-12" r="2.4"/><circle cx="7" cy="-9" r="2.4"/></g>
    <g class="sprout"><g class="sway"><path d="M 0 -2 Q 0 -16 0 -26" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 0 -20 Q -14 -24 -16 -34 Q -4 -32 0 -20 Z" fill="#4ade80"/><path d="M 0 -26 Q 12 -28 15 -38 Q 3 -38 0 -26 Z" fill="#22c55e"/></g></g>
  </g>
  <g fill="#e7d9c3" stroke="#d3c1a1" stroke-width="1.5">
    <circle class="puff" style="--dx:14px" cx="1012" cy="138" r="5"/><circle class="puff p2" style="--dx:-4px" cx="1000" cy="139" r="4"/>
  </g>
  <!-- cream point cat facing right, taking one step -->
  <g class="go"><g transform="scale(1.2)"><g class="bob">
    <g fill="#7b8794"><g transform="translate(-14,-20)"><g class="lg hf"><rect x="-3" y="0" width="6" height="13" rx="3"/><rect x="-3.5" y="12" width="7" height="8" rx="3.5"/></g></g>
    <g transform="translate(15,-20)"><g class="lg ff"><rect x="-3" y="0" width="6" height="13" rx="3"/><rect x="-3.5" y="12" width="7" height="8" rx="3.5"/></g></g></g>
    <path class="tail" d="M -27 -28 Q -54 -24 -52 -46 Q -51 -58 -43 -56" fill="none" stroke="#7b8794" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="0" cy="-27" rx="31" ry="14" fill="#f5ecd9"/>
    <ellipse cx="12" cy="-18" rx="14" ry="6" fill="#fffaf0"/>
    <g fill="#f5ecd9"><g transform="translate(-18,-20)"><g class="lg hn"><rect x="-3" y="0" width="6" height="13" rx="3"/><rect x="-3.5" y="12" width="7" height="8" rx="3.5" fill="#7b8794"/></g></g>
    <g transform="translate(22,-20)"><g class="lg fn"><rect x="-3" y="0" width="6" height="13" rx="3"/><rect x="-3.5" y="12" width="7" height="8" rx="3.5" fill="#7b8794"/></g></g></g>
    <polygon points="37,-50 45,-62 48,-45" fill="#64748b"/>
    <polygon points="23,-46 27,-62 38,-51" fill="#7b8794"/>
    <polygon points="27,-49 28,-58 34,-51" fill="#fbcfe8"/>
    <circle cx="35" cy="-37" r="13" fill="#f5ecd9"/>
    <path d="M 24 -42 Q 35 -52 46 -44 Q 40 -36 35 -34 Q 28 -34 24 -42 Z" fill="#7b8794" opacity=".75"/>
    <ellipse cx="44" cy="-32" rx="6" ry="5" fill="#fffaf0"/>
    <circle cx="48" cy="-35" r="1.8" fill="#f472b6"/>
    <g class="blink"><ellipse cx="39" cy="-40" rx="1.9" ry="2.8" fill="#38bdf8"/><ellipse cx="39.4" cy="-40" rx="0.9" ry="2.2" fill="#0c0a09"/></g>
    <path d="M 46 -30 q -2 3 -5 2" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    <g stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"><path d="M 41 -31 L 26 -25"/><path d="M 41 -33 L 24 -32"/><path d="M 41 -35 L 26 -39"/></g>
  </g></g></g>
</svg>
