<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bk{animation:bk 4s linear infinite;opacity:0}
    @keyframes bk{
      0%{transform:translate(776px,110px) scale(1);opacity:0}
      5%{opacity:1}
      68%{transform:translate(1030px,110px) scale(1) rotate(0)}
      84%{transform:translate(1074px,88px) scale(.5) rotate(-18deg);opacity:1}
      97%,100%{transform:translate(1086px,82px) scale(0) rotate(-30deg);opacity:0}
    }
    .belt{stroke-dasharray:14 12;animation:belt 1s linear infinite}
    @keyframes belt{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-26}}
    .roll{transform-box:fill-box;transform-origin:50% 50%;animation:roll 1s linear infinite}
    @keyframes roll{to{transform:rotate(360deg)}}
    .head{transform-box:fill-box;transform-origin:70% 100%;animation:hd 1.3333s ease-in-out infinite}
    @keyframes hd{0%,40%{transform:rotate(0)}55%{transform:rotate(-9deg)}72%,100%{transform:rotate(0)}}
    .bulb{transform-box:fill-box;transform-origin:50% 50%;animation:bu 1.3333s ease-in-out infinite}
    @keyframes bu{0%,40%{opacity:.35;transform:scale(1)}58%{opacity:1;transform:scale(1.25)}85%,100%{opacity:.35;transform:scale(1)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 3.2s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(0)}40%{transform:rotate(7deg)}60%{transform:rotate(-3deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:er 6s ease-in-out infinite}
    @keyframes er{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-14deg)}96%{transform:rotate(2deg)}}
    .blink{transform-box:fill-box;transform-origin:50% 50%;animation:bl 5s infinite}
    @keyframes bl{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#e4e4ec"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <text x="380" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="68" letter-spacing="3" fill="#312e81">効率的にインプット</text>
  <!-- conveyor -->
  <rect x="764" y="118" width="288" height="14" rx="7" fill="#6366f1"/>
  <line class="belt" x1="772" y1="125" x2="1044" y2="125" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round"/>
  <g fill="#4338ca"><circle class="roll" cx="774" cy="125" r="9"/><circle class="roll" cx="1042" cy="125" r="9"/></g>
  <g stroke="#a5b4fc" stroke-width="2"><line x1="774" y1="125" x2="774" y2="134"/><line x1="1042" y1="125" x2="1042" y2="134"/></g>
  <rect x="780" y="132" width="6" height="18" fill="#a5b4fc"/><rect x="1030" y="132" width="6" height="18" fill="#a5b4fc"/>
  <g class="bk" style="animation-delay:0.0000s"><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#f87171" stroke="#ffffff" stroke-width="1.5"/><rect x="-14" y="-10" width="6" height="20" rx="2" fill="#000" opacity=".18"/><line x1="-3" y1="-3" x2="10" y2="-3" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="-3" y1="3" x2="7" y2="3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
<g class="bk" style="animation-delay:-1.3333s"><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/><rect x="-14" y="-10" width="6" height="20" rx="2" fill="#000" opacity=".18"/><line x1="-3" y1="-3" x2="10" y2="-3" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="-3" y1="3" x2="7" y2="3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
<g class="bk" style="animation-delay:-2.6666s"><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/><rect x="-14" y="-10" width="6" height="20" rx="2" fill="#000" opacity=".18"/><line x1="-3" y1="-3" x2="10" y2="-3" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="-3" y1="3" x2="7" y2="3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>

  <!-- bulb -->
  <g class="bulb"><circle cx="1112" cy="20" r="9" fill="#fde047" stroke="#ca8a04" stroke-width="2"/><rect x="1108" y="28" width="8" height="5" rx="1.5" fill="#a16207"/></g>
  <!-- cow-spotted cat facing left -->
  <g transform="translate(1128,148) scale(1.15)">
    <path class="tail" d="M 24 -6 Q 52 -6 50 -32 Q 49 -46 41 -44" fill="none" stroke="#fafafa" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 49 -34 Q 49 -46 41 -44" fill="none" stroke="#27272a" stroke-width="8.5" stroke-linecap="round" class="tail"/>
    <ellipse cx="6" cy="-26" rx="21" ry="27" fill="#fafafa" stroke="#e4e4e7" stroke-width="1" transform="rotate(-8 6 -26)"/>
    <path d="M 8 -50 Q 24 -46 24 -30 Q 12 -28 6 -38 Z" fill="#27272a"/>
    <path d="M 4 -14 Q 16 -16 20 -6 Q 8 -2 4 -14 Z" fill="#27272a"/>
    <rect x="-17" y="-24" width="8" height="24" rx="4" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
    <g class="head">
      <polygon points="-26,-70 -24,-88 -13,-74" fill="#27272a"/>
      <g class="ear"><polygon points="-9,-74 -2,-86 4,-68" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/></g>
      <circle cx="-12" cy="-60" r="16" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <path d="M -12 -76 A 16 16 0 0 1 4 -62 L -6 -58 Q -14 -66 -12 -76 Z" fill="#27272a"/>
      <ellipse cx="-24" cy="-55" rx="7" ry="6" fill="#fafafa"/>
      <circle cx="-30" cy="-58" r="2" fill="#f472b6"/>
      <g class="blink"><ellipse cx="-19" cy="-62" rx="2.2" ry="3.2" fill="#a3e635"/><ellipse cx="-19.6" cy="-62" rx="1" ry="2.6" fill="#0c0a09"/></g>
      <g stroke="#a1a1aa" stroke-width="1.3" stroke-linecap="round"><path d="M -23 -55 L -6 -50"/><path d="M -23 -57 L -4 -57"/><path d="M -23 -59 L -6 -64"/></g>
    </g>
  </g>
</svg>
