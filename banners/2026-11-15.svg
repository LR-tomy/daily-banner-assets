<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .refl{animation:rf 4.5s ease-in-out infinite;transform-box:view-box;transform-origin:1010px 84px}
    @keyframes rf{0%,100%{transform:skewX(-3deg) translateX(2px)}50%{transform:skewX(3deg) translateX(-2px)}}
    .ring{transform-box:fill-box;transform-origin:50% 50%;animation:rg 5s ease-out infinite;opacity:0}
    .r2{animation-delay:2.5s}
    @keyframes rg{0%{transform:scale(.5);opacity:.8}100%{transform:scale(2.4);opacity:0}}
    .w1{animation:w1 5s linear infinite}
    @keyframes w1{0%{transform:translateX(0)}100%{transform:translateX(-40px)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 4s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:er 7s ease-in-out infinite}
    @keyframes er{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-14deg)}96%{transform:rotate(2deg)}}
    .blink{transform-box:fill-box;transform-origin:50% 50%;animation:bl 6s infinite}
    @keyframes bl{0%,88%,94%,100%{transform:scaleY(1)}91%{transform:scaleY(.1)}}
    .head{transform-box:fill-box;transform-origin:70% 100%;animation:hd 6s ease-in-out infinite}
    @keyframes hd{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(-21deg)}}
    .sparkle{transform-box:fill-box;transform-origin:50% 50%;animation:sp 6s ease-in-out infinite;opacity:0}
    @keyframes sp{0%,50%{transform:scale(0);opacity:0}60%{transform:scale(1.2);opacity:1}75%,100%{transform:scale(.4);opacity:0}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fff7e6"/><stop offset="100%" stop-color="#ffe3bd"/></linearGradient>
    <linearGradient id="wt" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#6d6bd6"/><stop offset="100%" stop-color="#3730a3"/></linearGradient>
    <clipPath id="pool"><rect x="0" y="84" width="1200" height="66"/></clipPath>
    <g id="cat">
      <path class="tail" d="M 24 -6 Q 52 -6 50 -32 Q 49 -46 41 -44" fill="none" stroke="#f4f1ea" stroke-width="8.5" stroke-linecap="round"/>
      <ellipse cx="6" cy="-26" rx="21" ry="27" fill="#fbfaf6" stroke="#e5e0d4" stroke-width="1" transform="rotate(-8 6 -26)"/>
      <ellipse cx="-3" cy="-24" rx="8" ry="16" fill="#ffffff"/>
      <rect x="-17" y="-24" width="8" height="24" rx="4" fill="#fbfaf6" stroke="#e5e0d4" stroke-width="1"/>
      <g class="head">
        <polygon points="-26,-70 -24,-88 -13,-74" fill="#d6d3c8"/>
        <g class="ear"><polygon points="-9,-74 -2,-86 4,-68" fill="#fbfaf6" stroke="#e5e0d4" stroke-width="1"/></g>
        <circle cx="-12" cy="-60" r="16" fill="#fbfaf6" stroke="#e5e0d4" stroke-width="1"/>
        <path d="M -28 -64 Q -22 -72 -12 -72" fill="none" stroke="#c7c2b4" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="-24" cy="-55" rx="7" ry="6" fill="#ffffff"/>
        <circle cx="-30" cy="-58" r="2" fill="#f9a8d4"/>
        <g class="blink"><ellipse cx="-19" cy="-62" rx="2.8" ry="3.4" fill="#10b981" stroke="#27272a" stroke-width="1"/><ellipse cx="-19.6" cy="-62" rx="1" ry="2.6" fill="#0c0a09"/></g>
        <g stroke="#a1a1aa" stroke-width="1.3" stroke-linecap="round"><path d="M -23 -55 L -6 -50"/><path d="M -23 -57 L -4 -57"/><path d="M -23 -59 L -6 -64"/></g>
      </g>
    </g>
  </defs>
  <rect width="1200" height="84" fill="url(#sky)"/>
  <text x="400" y="40" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="60" letter-spacing="6" fill="#1e1b4b">自分を見つめる</text>
  <rect y="84" width="1200" height="66" fill="url(#wt)"/>
  <g clip-path="url(#pool)">
    <g class="refl" opacity=".5"><g transform="translate(1010,84) scale(.7,-.7)"><use href="#cat"/></g></g>
    <g opacity=".35"><path class="w1" d="M -40 100 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 q 10 -3 20 0 t 20 0 L 1300 160 L -40 160 Z" fill="#a5b4fc"/></g>
    <g opacity=".25"><path class="w1" style="animation-duration:3s" d="M -40 122 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 q 10 -2 20 0 t 20 0 L 1300 160 L -40 160 Z" fill="#c7d2fe"/></g>
  </g>
  <g fill="none" stroke="#e0e7ff" stroke-width="2"><ellipse class="ring" cx="1010" cy="90" rx="46" ry="6"/><ellipse class="ring r2" cx="1010" cy="90" rx="46" ry="6"/></g>
  <ellipse cx="1010" cy="85" rx="44" ry="8" fill="#a8a29e"/><ellipse cx="1004" cy="82" rx="36" ry="6" fill="#d6d3d1"/>
  <g transform="translate(1012,82) scale(.7)"><use href="#cat"/></g>
  <g class="sparkle"><path d="M 958 104 l 2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#ffffff"/></g>
</svg>
