<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fa{transform-box:fill-box;transform-origin:50% 0%;animation:fa 1.6s ease-in-out infinite}
    .fb{animation-delay:-.8s}
    @keyframes fa{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-5px) rotate(24deg)}}
    .br{transform-box:fill-box;transform-origin:50% 100%;animation:br 3.2s ease-in-out infinite}
    @keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.045)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 3.6s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:er 6s ease-in-out infinite}
    @keyframes er{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-12deg)}96%{transform:rotate(2deg)}}
    .ht{animation:ht 4.5s ease-out infinite;opacity:0}
    @keyframes ht{0%{transform:translate(0,0);opacity:0}20%{opacity:.95}100%{transform:translate(-14px,-58px);opacity:0}}
    .pat{animation:pat 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes pat{0%,100%{opacity:.0}25%,75%{opacity:.25}}
    .dust{animation:du 14s linear infinite}
    @keyframes du{0%{transform:translate(0,0);opacity:0}15%{opacity:.6}100%{transform:translate(-20px,-110px);opacity:0}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf7f2"/><stop offset="100%" stop-color="#f1e6da"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <g fill="#f5d9b8"><circle class="dust" cx="220" cy="150" r="4"/><circle class="dust" style="animation-delay:-5s" cx="600" cy="150" r="3"/><circle class="dust" style="animation-delay:-9s" cx="820" cy="150" r="4"/></g>
  <text x="380" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="80" letter-spacing="6" fill="#5b3a29">心をほぐす</text>
  <!-- blanket -->
  <path d="M 880 150 Q 890 108 940 106 Q 1000 100 1060 106 Q 1130 104 1160 112 Q 1200 118 1200 150 Z" fill="#f2c14e"/>
  <clipPath id="bl"><path d="M 880 150 Q 890 108 940 106 Q 1000 100 1060 106 Q 1130 104 1160 112 Q 1200 118 1200 150 Z"/></clipPath>
  <g clip-path="url(#bl)"><path d="M 910 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 924 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 938 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 952 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 966 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 980 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 994 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1008 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1022 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1036 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1050 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1064 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1078 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1092 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1106 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1120 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1134 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1148 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1162 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M 1176 112 q 5 8 0 16 t 0 16" fill="none" stroke="#e2a93a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/></g>
  <path d="M 940 106 Q 1000 100 1060 106 Q 1130 104 1160 112" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  <ellipse class="pat" cx="992" cy="108" rx="14" ry="4" fill="#b45309"/>
  <!-- lilac cat kneading, facing left -->
  <g transform="translate(1050,108) scale(1.3)">
    <path class="tail" d="M 28 -14 Q 54 -14 52 -40 Q 51 -52 43 -50" fill="none" stroke="#a89aa6" stroke-width="8" stroke-linecap="round"/>
    <g class="br">
      <ellipse cx="4" cy="-20" rx="32" ry="19" fill="#b8a9b5"/>
      <ellipse cx="-6" cy="-10" rx="18" ry="8" fill="#f5eef2"/>
    </g>
    <g fill="#b8a9b5">
      <g transform="translate(-26,-16)"><g class="fa"><rect x="-3.5" y="0" width="7" height="18" rx="3.5"/><ellipse cx="0" cy="18" rx="5" ry="3.5" fill="#f5eef2"/></g></g>
      <g transform="translate(-16,-16)"><g class="fa fb"><rect x="-3.5" y="0" width="7" height="18" rx="3.5"/><ellipse cx="0" cy="18" rx="5" ry="3.5" fill="#f5eef2"/></g></g>
    </g>
    <polygon points="-52,-44 -50,-58 -40,-46" fill="#9b8c99"/>
    <g class="ear"><polygon points="-38,-47 -31,-58 -26,-42" fill="#b8a9b5"/></g>
    <circle cx="-38" cy="-30" r="15" fill="#b8a9b5"/>
    <ellipse cx="-49" cy="-24" rx="6.5" ry="5.5" fill="#f5eef2"/>
    <circle cx="-54" cy="-27" r="1.8" fill="#f472b6"/>
    <path d="M -46 -33 q 3 4 7 0" fill="none" stroke="#3f2f3a" stroke-width="2" stroke-linecap="round"/>
    <path d="M -49 -22 q 3 3 7 1" fill="none" stroke="#7c6a78" stroke-width="1.3" stroke-linecap="round"/>
    <g stroke="#f5eef2" stroke-width="1.3" stroke-linecap="round"><path d="M -47 -24 L -30 -19"/><path d="M -47 -26 L -28 -26"/><path d="M -47 -28 L -30 -33"/></g>
  </g>
  <g transform="translate(1100,66)"><g class="ht" style="animation-delay:0s"><path d="M0 5 C-7 -2 -7 -9 0 -6 C7 -9 7 -2 0 5Z" fill="#f472b6" transform="scale(1.3)"/></g></g><g transform="translate(1128,66)"><g class="ht" style="animation-delay:1.5s"><path d="M0 5 C-7 -2 -7 -9 0 -6 C7 -9 7 -2 0 5Z" fill="#f472b6" transform="scale(1.0)"/></g></g><g transform="translate(1150,66)"><g class="ht" style="animation-delay:3s"><path d="M0 5 C-7 -2 -7 -9 0 -6 C7 -9 7 -2 0 5Z" fill="#f472b6" transform="scale(1.2)"/></g></g>
</svg>
