<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .arm{transform-box:view-box;transform-origin:0px 0px;animation:arm 6s ease-in-out infinite}
    @keyframes arm{0%,12%{transform:rotate(0)}34%,60%{transform:rotate(34deg)}80%,100%{transform:rotate(0)}}
    .hd{transform-box:fill-box;transform-origin:70% 100%;animation:hd 6s ease-in-out infinite}
    @keyframes hd{0%,12%{transform:rotate(0)}34%,60%{transform:rotate(8deg)}80%,100%{transform:rotate(0)}}
    .steam{animation:st 3.2s ease-out infinite;opacity:0}
    .s2{animation-delay:1.1s}.s3{animation-delay:2.1s}
    @keyframes st{0%{transform:translateY(0);opacity:0}25%{opacity:.85}100%{transform:translateY(-30px);opacity:0}}
    .sun{animation:sun 14s ease-in-out infinite}
    @keyframes sun{0%{transform:translateY(46px);opacity:.0}10%{opacity:1}70%,92%{transform:translateY(-6px);opacity:1}100%{transform:translateY(-6px);opacity:0}}
    .beam{animation:bm 5s ease-in-out infinite}
    @keyframes bm{0%,100%{opacity:.22}50%{opacity:.42}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 3.6s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(0)}40%{transform:rotate(8deg)}60%{transform:rotate(-2deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:er 7s ease-in-out infinite}
    @keyframes er{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-12deg)}96%{transform:rotate(2deg)}}
    .mote{animation:mt 10s linear infinite}
    @keyframes mt{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(40px,-60px);opacity:0}}
  </style>
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e3f3ef"/><stop offset="100%" stop-color="#cfe8e4"/></linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fcd5b5"/><stop offset="100%" stop-color="#fef3a3"/></linearGradient>
    <radialGradient id="gl"><stop offset="0%" stop-color="#fffbe0"/><stop offset="55%" stop-color="#fde047"/><stop offset="100%" stop-color="#fb923c"/></radialGradient>
    <clipPath id="win"><rect x="812" y="14" width="150" height="112" rx="4"/></clipPath>
  </defs>
  <rect width="1200" height="150" fill="url(#wall)"/>
  <text x="360" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="66" letter-spacing="2" fill="#134e4a">イマココを堪能する</text>
  <!-- window -->
  <rect x="812" y="14" width="150" height="112" rx="4" fill="url(#sky)"/>
  <g clip-path="url(#win)"><g class="sun"><circle cx="887" cy="104" r="26" fill="url(#gl)"/></g>
  <path d="M 812 120 Q 850 102 890 112 T 962 108 L 962 126 L 812 126 Z" fill="#b45309" opacity=".35"/></g>
  <rect x="812" y="14" width="150" height="112" rx="4" fill="none" stroke="#8a6a3d" stroke-width="6"/>
  <line x1="887" y1="14" x2="887" y2="126" stroke="#8a6a3d" stroke-width="4"/><line x1="812" y1="70" x2="962" y2="70" stroke="#8a6a3d" stroke-width="4"/>
  <rect x="802" y="124" width="170" height="8" rx="3" fill="#a47c52"/>
  <polygon class="beam" points="966,20 966,124 1100,150 1100,70" fill="#fde68a"/>
  <g fill="#fff7c2"><circle class="mote" cx="990" cy="120" r="2.5"/><circle class="mote" style="animation-delay:-4s" cx="1030" cy="130" r="2"/><circle class="mote" style="animation-delay:-7s" cx="1010" cy="110" r="2.5"/></g>
  <rect y="140" width="1200" height="10" fill="#b8d8d2"/>
  <!-- bengal cat sipping, facing left -->
  <g transform="translate(1124,146) scale(1.15)">
    <path class="tail" d="M 24 -6 Q 52 -6 50 -32 Q 49 -46 41 -44" fill="none" stroke="#d9942e" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="6" cy="-26" rx="21" ry="27" fill="#d9942e" transform="rotate(-8 6 -26)"/>
    <g fill="none" stroke="#7c3f10" stroke-width="2"><path d="M 10 -40 q 3 -5 7 -1 q 2 5 -3 6 q -5 0 -4 -5 z"/></g><g fill="none" stroke="#7c3f10" stroke-width="2"><path d="M 16 -30 q 3 -5 7 -1 q 2 5 -3 6 q -5 0 -4 -5 z"/></g><g fill="none" stroke="#7c3f10" stroke-width="2"><path d="M 14 -18 q 3 -5 7 -1 q 2 5 -3 6 q -5 0 -4 -5 z"/></g><g fill="none" stroke="#7c3f10" stroke-width="2"><path d="M 2 -14 q 3 -5 7 -1 q 2 5 -3 6 q -5 0 -4 -5 z"/></g><g fill="none" stroke="#7c3f10" stroke-width="2"><path d="M 22 -24 q 3 -5 7 -1 q 2 5 -3 6 q -5 0 -4 -5 z"/></g><g fill="none" stroke="#7c3f10" stroke-width="2"><path d="M -2 -30 q 3 -5 7 -1 q 2 5 -3 6 q -5 0 -4 -5 z"/></g>
    <ellipse cx="-3" cy="-24" rx="8" ry="15" fill="#f6e3c0"/>
    <g class="hd">
      <polygon points="-26,-70 -24,-88 -13,-74" fill="#b87a1f"/>
      <g class="ear"><polygon points="-9,-74 -2,-86 4,-68" fill="#d9942e"/></g>
      <circle cx="-12" cy="-60" r="16" fill="#d9942e"/>
      <g fill="none" stroke="#7c3f10" stroke-width="2" stroke-linecap="round"><path d="M -14 -75 v 5"/><path d="M -8 -75 v 5"/><path d="M -2 -72 v 4"/></g>
      <ellipse cx="-24" cy="-55" rx="7" ry="6" fill="#f6e3c0"/>
      <circle cx="-30" cy="-58" r="2" fill="#f472b6"/>
      <path d="M -24 -63 q 4 4 8 0" fill="none" stroke="#3b2208" stroke-width="2.2" stroke-linecap="round"/>
      <g stroke="#fff7ed" stroke-width="1.3" stroke-linecap="round"><path d="M -23 -55 L -6 -50"/><path d="M -23 -57 L -4 -57"/><path d="M -23 -59 L -6 -64"/></g>
    </g>
    <g transform="translate(-10,-26)"><g class="arm">
      <rect x="-26" y="-4" width="26" height="8" rx="4" fill="#d9942e"/>
      <g transform="translate(-32,0)">
        <rect x="-9" y="-9" width="16" height="18" rx="3" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
        <path d="M -9 -4 q -9 0 -9 6 t 9 5" fill="none" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="-1" cy="-9" rx="8" ry="2.4" fill="#92400e"/>
        <ellipse cx="3" cy="2" rx="4.5" ry="3.5" fill="#f6e3c0"/>
      </g>
    </g></g>
    <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity=".9">
      <g transform="translate(-44,-40)"><g class="steam"><path d="M 0 0 q 4 -5 0 -10"/></g></g>
      <g transform="translate(-39,-40)"><g class="steam s2"><path d="M 0 0 q 4 -5 0 -10"/></g></g>
      <g transform="translate(-34,-40)"><g class="steam s3"><path d="M 0 0 q 4 -5 0 -10"/></g></g>
    </g>
  </g>
</svg>
