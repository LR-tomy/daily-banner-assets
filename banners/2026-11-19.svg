<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .arm{transform-box:view-box;transform-origin:0px 0px;animation:arm 8s ease-in-out infinite}
    @keyframes arm{0%,12%{transform:rotate(0)}24%,60%{transform:rotate(105deg)}74%,100%{transform:rotate(0)}}
    .can{transform-box:view-box;transform-origin:0px 46px;animation:can 8s ease-in-out infinite}
    @keyframes can{0%,26%{transform:rotate(0)}34%,58%{transform:rotate(-14deg)}66%,100%{transform:rotate(0)}}
    .head{transform-box:fill-box;transform-origin:70% 100%;animation:hd 8s ease-in-out infinite}
    @keyframes hd{0%,12%{transform:rotate(0)}26%,62%{transform:rotate(-6deg)}76%,100%{transform:rotate(0)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 3.8s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(0)}40%{transform:rotate(7deg)}60%{transform:rotate(-3deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:er 7s ease-in-out infinite}
    @keyframes er{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}95%{transform:rotate(2deg)}}
    .blink{transform-box:fill-box;transform-origin:50% 50%;animation:bl 5s infinite}
    @keyframes bl{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    .drop{opacity:0}
    .d1{animation:d1 8s linear infinite} .d2{animation:d2 8s linear infinite} .d3{animation:d3 8s linear infinite}
    @keyframes d1{0%,34%{transform:translateY(0);opacity:0}35%{opacity:1}41%{transform:translateY(17px);opacity:1}42%,100%{transform:translateY(17px);opacity:0}}
    @keyframes d2{0%,40%{transform:translateY(0);opacity:0}41%{opacity:1}47%{transform:translateY(17px);opacity:1}48%,100%{transform:translateY(17px);opacity:0}}
    @keyframes d3{0%,46%{transform:translateY(0);opacity:0}47%{opacity:1}53%{transform:translateY(17px);opacity:1}54%,100%{transform:translateY(17px);opacity:0}}
    .sprout{transform-box:fill-box;transform-origin:50% 100%;animation:sg 8s ease-in-out infinite}
    @keyframes sg{0%,30%{transform:scale(.25)}66%,92%{transform:scale(1)}100%{transform:scale(.25)}}
    .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite}
    @keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    .spark{transform-box:fill-box;transform-origin:50% 50%;animation:sp 8s ease-out infinite;opacity:0}
    @keyframes sp{0%,66%{transform:scale(0);opacity:0}72%{transform:scale(1.3);opacity:1}84%,100%{transform:scale(.5);opacity:0}}
    .beam{animation:bm 6s ease-in-out infinite}
    @keyframes bm{0%,100%{opacity:.35}50%{opacity:.7}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#fde2d3"/></linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <polygon class="beam" points="860,0 960,0 1130,150 1000,150" fill="#fff3c4"/>
  <text x="340" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="56" letter-spacing="1" fill="#1e3a5f">丁寧に向き合うべし</text>
  <rect y="146" width="1200" height="4" fill="#efc4ac"/>
  <!-- pot + sprout -->
  <g transform="translate(1055,104)">
    <g class="sprout"><g class="sway">
      <path d="M 0 0 L 0 -26" stroke="#4d9a5a" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-8" cy="-22" rx="8" ry="4" fill="#6bbf6e" transform="rotate(-30 -8 -22)"/>
      <ellipse cx="8" cy="-27" rx="8" ry="4" fill="#4fae5a" transform="rotate(30 8 -27)"/>
      <ellipse cx="0" cy="-32" rx="3.5" ry="6" fill="#86d28a"/>
    </g></g>
    <path d="M -14 0 L 14 0 L 11 14 L -11 14 Z" fill="#c2552d"/><rect x="-16" y="-3" width="32" height="5" rx="1.5" fill="#d9683a"/>
  </g>
  <g class="spark"><path d="M 1076 66 l 2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#fbbf24"/></g>
  <!-- drops -->
  <g class="drop d1"><path d="M 1058 84 q -2.5 4 0 5.5 q 2.5 -1.5 0 -5.5 z" fill="#38bdf8"/></g>
  <g class="drop d2"><path d="M 1056 84 q -2.5 4 0 5.5 q 2.5 -1.5 0 -5.5 z" fill="#38bdf8"/></g>
  <g class="drop d3"><path d="M 1059 84 q -2.5 4 0 5.5 q 2.5 -1.5 0 -5.5 z" fill="#38bdf8"/></g>
  <!-- birman cat facing left -->
  <g transform="translate(1128,118) scale(.9)">
    <g class="tail"><path d="M 24 -6 Q 52 -6 50 -32 Q 49 -46 41 -44" fill="none" stroke="#f3e6d0" stroke-width="8" stroke-linecap="round"/>
    <path d="M 24 -6 Q 52 -6 50 -32 Q 49 -46 41 -44" fill="none" stroke="#5a4535" stroke-width="8.2" stroke-linecap="round" stroke-dasharray="0 50 60"/></g>
    <ellipse cx="6" cy="-26" rx="21" ry="27" fill="#f3e6d0" transform="rotate(-8 6 -26)"/>
    <ellipse cx="-3" cy="-22" rx="8" ry="14" fill="#fffaf0"/>
    <g class="head">
      <polygon points="-26,-70 -24,-88 -13,-74" fill="#5a4535"/>
      <g class="ear"><polygon points="-9,-74 -2,-86 4,-68" fill="#5a4535"/></g>
      <circle cx="-12" cy="-60" r="16" fill="#f3e6d0"/>
      <ellipse cx="-23" cy="-55" rx="6.5" ry="5" fill="#5a4535"/>
      <circle cx="-29" cy="-57" r="2" fill="#f472b6"/>
      <g class="blink"><ellipse cx="-18" cy="-62" rx="2.6" ry="3.4" fill="#38bdf8"/><ellipse cx="-18.5" cy="-62" rx="1.1" ry="2.8" fill="#0c0a09"/></g>
      <g stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity=".95"><path d="M -23 -55 L -6 -50"/><path d="M -23 -57 L -4 -57"/><path d="M -23 -59 L -6 -64"/></g>
    </g>
    <g transform="translate(-12,-30)"><g class="arm">
      <rect x="-4.5" y="0" width="9" height="40" rx="4.5" fill="#f3e6d0"/>
      <g class="can">
        <ellipse cx="0" cy="43" rx="5.5" ry="4.5" fill="#ffffff"/>
        <rect x="-9" y="40" width="18" height="16" rx="3" fill="#3b8b8b"/>
        <rect x="-9" y="40" width="18" height="4" rx="2" fill="#5fb3b3"/>
        <path d="M 4 55 L 8 70" stroke="#3b8b8b" stroke-width="3.2" stroke-linecap="round"/>
        <ellipse cx="8.4" cy="71" rx="2.6" ry="1.4" fill="#2a6b6b"/>
      </g>
    </g></g>
  </g>
  <!-- table drawn over the cat base and can -->
  <rect x="930" y="118" width="270" height="32" fill="#b08968"/><rect x="930" y="118" width="270" height="5" fill="#c9a27c"/>
</svg>
