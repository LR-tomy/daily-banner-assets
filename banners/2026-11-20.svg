<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .grid{animation:gr 6s linear infinite}
    @keyframes gr{from{transform:translateX(0)}to{transform:translateX(-30px)}}
    .mast{transform-box:fill-box;transform-origin:50% 100%;animation:ms 8s ease-in-out infinite}
    @keyframes ms{0%,10%{transform:scaleY(.25)}32%,86%{transform:scaleY(1)}98%,100%{transform:scaleY(.25)}}
    .top{animation:tp 8s ease-in-out infinite}
    @keyframes tp{0%,10%{transform:translateY(63px)}32%,86%{transform:translateY(0)}98%,100%{transform:translateY(63px)}}
    .sig{animation:sg 8s ease-in-out infinite;opacity:0}
    @keyframes sg{0%,33%{opacity:0}38%,84%{opacity:1}92%,100%{opacity:0}}
    .ring{transform-box:fill-box;transform-origin:50% 50%;animation:rg 2.4s ease-out infinite}
    .r2{animation-delay:-.8s} .r3{animation-delay:-1.6s}
    @keyframes rg{0%{transform:scale(.15);opacity:.95}100%{transform:scale(1);opacity:0}}
    .rx{animation:rx 8s ease-in-out infinite;opacity:0}
    @keyframes rx{0%,42%{opacity:0}50%,76%{opacity:1}86%,100%{opacity:0}}
    .head{transform-box:fill-box;transform-origin:70% 100%;animation:hd 8s ease-in-out infinite}
    @keyframes hd{0%,18%{transform:rotate(0)}32%,80%{transform:rotate(-10deg)}92%,100%{transform:rotate(0)}}
    .earL{transform-box:fill-box;transform-origin:50% 100%;animation:eL 8s ease-in-out infinite}
    .earR{transform-box:fill-box;transform-origin:50% 100%;animation:eR 8s ease-in-out infinite}
    @keyframes eL{0%,34%{transform:rotate(0)}40%{transform:rotate(-14deg)}46%{transform:rotate(4deg)}52%,100%{transform:rotate(-6deg)}}
    @keyframes eR{0%,36%{transform:rotate(0)}43%{transform:rotate(-12deg)}49%{transform:rotate(3deg)}56%,100%{transform:rotate(-5deg)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 3.4s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(0)}40%{transform:rotate(7deg)}60%{transform:rotate(-3deg)}}
    .blink{transform-box:fill-box;transform-origin:50% 50%;animation:bl 5s infinite}
    @keyframes bl{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    .blip{animation:bp 1s ease-in-out infinite}
    @keyframes bp{0%,100%{opacity:.4}50%{opacity:1}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <pattern id="gp" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <g class="grid"><rect x="0" y="0" width="1240" height="150" fill="url(#gp)"/></g>
  <text x="340" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="56" letter-spacing="1" fill="#ffffff">アンテナを立てる</text>
  <!-- cat, fawn oriental, facing left -->
  <g transform="translate(1110,118) scale(.9)">
    <g class="tail"><path d="M 24 -6 Q 52 -6 50 -32 Q 49 -46 41 -44" fill="none" stroke="#d2a679" stroke-width="8" stroke-linecap="round"/></g>
    <ellipse cx="6" cy="-26" rx="21" ry="27" fill="#d2a679" transform="rotate(-8 6 -26)"/>
    <ellipse cx="-3" cy="-22" rx="8" ry="14" fill="#f1dfc4"/>
    <g class="head">
      <g class="earL"><polygon points="-28,-68 -27,-98 -9,-72" fill="#d2a679"/><polygon points="-24,-72 -25,-90 -14,-74" fill="#f9a8a8"/></g>
      <g class="earR"><polygon points="-8,-72 1,-98 9,-64" fill="#d2a679"/><polygon points="-4,-73 1,-90 5,-68" fill="#f9a8a8"/></g>
      <circle cx="-12" cy="-60" r="16" fill="#d2a679"/>
      <ellipse cx="-22" cy="-55" rx="7.5" ry="6" fill="#f1dfc4"/>
      <circle cx="-28.5" cy="-57" r="2" fill="#f472b6"/>
      <g class="blink"><ellipse cx="-18" cy="-62" rx="2.6" ry="3.4" fill="#84cc16"/><ellipse cx="-18.5" cy="-62" rx="1.1" ry="2.8" fill="#0c0a09"/></g>
      <g stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity=".95"><path d="M -22 -55 L -5 -50"/><path d="M -22 -57 L -3 -57"/><path d="M -22 -59 L -5 -64"/></g>
    </g>
    <g fill="#d2a679"><rect x="-16" y="-8" width="8" height="10" rx="4"/></g>
  </g>
  <!-- received arcs near the ears -->
  <g class="rx" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round">
    <path d="M 1070 24 Q 1062 32 1066 42"/><path d="M 1062 20 Q 1050 32 1056 46"/>
  </g>
  <!-- antenna -->
  <g transform="translate(1000,118)">
    <g class="mast"><rect x="-1.6" y="-84" width="3.2" height="84" fill="#e5e7eb"/></g>
    <g class="top">
      <g transform="translate(0,-84)">
        <path d="M 0 0 L -12 -12 M 0 0 L 12 -12 M 0 0 L 0 -16" stroke="#fde047" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <circle class="blip" cx="0" cy="-17" r="3" fill="#fb7185"/>
        <g class="sig" fill="none" stroke="#67e8f9" stroke-width="2.4">
          <circle class="ring" cx="0" cy="-8" r="46"/><circle class="ring r2" cx="0" cy="-8" r="46"/><circle class="ring r3" cx="0" cy="-8" r="46"/>
        </g>
      </g>
    </g>
    <rect x="-9" y="-5" width="18" height="5" rx="1.5" fill="#94a3b8"/>
  </g>
  <!-- roof -->
  <rect x="930" y="118" width="270" height="32" fill="#172554"/><rect x="930" y="118" width="270" height="4" fill="#60a5fa"/>
  <rect y="146" width="930" height="4" fill="#3b82f6" opacity=".6"/>
</svg>
