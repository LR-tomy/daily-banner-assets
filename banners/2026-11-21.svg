<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .arm{transform-box:view-box;transform-origin:0px 0px;animation:arm 8s ease-in-out infinite}
    @keyframes arm{0%,12%{transform:rotate(0)}28%,84%{transform:rotate(90deg)}95%,100%{transform:rotate(0)}}
    .um{transform-box:view-box;transform-origin:0px 56px;animation:um 8s ease-in-out infinite}
    @keyframes um{0%,12%{transform:rotate(0);opacity:0}22%{opacity:0}28%,84%{transform:rotate(-90deg);opacity:1}86%{transform:rotate(-90deg);opacity:0}88%,100%{transform:rotate(0);opacity:0}}
    .hdA{transform-box:fill-box;transform-origin:70% 100%;animation:hA 8s ease-in-out infinite}
    @keyframes hA{0%,26%{transform:rotate(0)}34%,72%{transform:rotate(-6deg)}88%,100%{transform:rotate(0)}}
    .hdB{transform-box:fill-box;transform-origin:70% 100%;animation:hB 8s ease-in-out infinite}
    @keyframes hB{0%,34%{transform:rotate(-16deg)}46%,84%{transform:rotate(5deg)}94%,100%{transform:rotate(-16deg)}}
    .eyeB{transform-box:fill-box;transform-origin:50% 50%;animation:eB 8s ease-in-out infinite}
    @keyframes eB{0%,36%{transform:scaleY(.2)}43%,86%{transform:scaleY(1)}94%,100%{transform:scaleY(.2)}}
    .eyeA{transform-box:fill-box;transform-origin:50% 50%;animation:bl 5s infinite}
    @keyframes bl{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 3.6s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(0)}40%{transform:rotate(7deg)}60%{transform:rotate(-3deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:er 7s ease-in-out infinite}
    @keyframes er{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}95%{transform:rotate(2deg)}}
    .fall{animation:fl .5s linear infinite}
    @keyframes fl{from{transform:translateY(0)}to{transform:translateY(24px)}}
    .outer{animation:ou 8s ease-in-out infinite}
    @keyframes ou{0%,56%{opacity:1}66%,94%{opacity:0}100%{opacity:1}}
    .inner{animation:inn 8s ease-in-out infinite}
    @keyframes inn{0%,22%{opacity:1}26%,96%{opacity:0}100%{opacity:1}}
    .cloud{animation:cd 8s ease-in-out infinite}
    @keyframes cd{0%,56%{opacity:1;transform:translate(0,0)}66%{opacity:0;transform:translate(8px,-6px)}94%{opacity:0;transform:translate(0,0)}100%{opacity:1}}
    .rb{stroke-dasharray:1;animation:rbk 8s ease-out infinite}
    @keyframes rbk{0%,60%{stroke-dashoffset:1}76%,92%{stroke-dashoffset:0}99%,100%{stroke-dashoffset:1}}
    .warm{animation:wm 8s ease-in-out infinite;opacity:0}
    @keyframes wm{0%,56%{opacity:0}72%,90%{opacity:.55}100%{opacity:0}}
    .ht{animation:ht 8s ease-out infinite;opacity:0}
    .h2{animation-name:ht2}
    @keyframes ht{0%,44%{opacity:0;transform:translate(0,0)}50%{opacity:1}72%,100%{opacity:0;transform:translate(0,-26px)}}
    @keyframes ht2{0%,52%{opacity:0;transform:translate(0,0)}58%{opacity:1}80%,100%{opacity:0;transform:translate(0,-26px)}}
  </style>
