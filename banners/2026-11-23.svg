    <ellipse cx="34" cy="-24" rx="4" ry="3" fill="#374151"/>
    <circle cx="37.5" cy="-25" r="1.3" fill="#f472b6"/>
    <g class="eye"><ellipse cx="30.5" cy="-29" rx="2.4" ry="3" fill="#fbbf24"/><ellipse cx="31" cy="-29" rx="1" ry="2.5" fill="#000"/></g>
    <g stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"><path d="M 34 -23 L 44 -20"/><path d="M 34 -24.5 L 45 -25"/><path d="M 34 -26 L 44 -30"/></g>
    <g class="scarf"><path d="M 14 -25 Q 4 -20 -4 -26 L -6 -22 Q 4 -14 15 -20 Z" fill="#fb923c"/><path d="M 14 -25 L 19 -22 L 16 -17 L 12 -20 Z" fill="#f97316"/></g>
  </g></g>
