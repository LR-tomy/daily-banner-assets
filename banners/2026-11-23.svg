<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .m1{animation:ms 30s linear infinite} .m2{animation:ms 18s linear infinite}
    @keyframes ms{from{transform:translateX(0)}to{transform:translateX(-300px)}}
    .w1{animation:ws 3s linear infinite} .w2{animation:ws 2s linear infinite reverse}
    @keyframes ws{from{transform:translateX(0)}to{transform:translateX(-60px)}}
    .cat{animation:ct 8s ease-in-out infinite}
    @keyframes ct{
      0%,12%{transform:translate(800px,127px);opacity:1}
      22.5%{transform:translate(850px,106px)}
      30%,44%{transform:translate(900px,127px)}
      52.5%{transform:translate(950px,106px)}
      60%,69%{transform:translate(1000px,127px)}
      77.5%{transform:translate(1050px,106px)}
      85%,90%{transform:translate(1100px,127px);opacity:1}
      94%{transform:translate(1100px,127px);opacity:0}
      94.1%{transform:translate(800px,127px);opacity:0}
      99%,100%{transform:translate(800px,127px);opacity:1}}
    .lgA{transform-box:fill-box;transform-origin:50% 0%;animation:la 8s linear infinite}
    .lgB{transform-box:fill-box;transform-origin:50% 0%;animation:lb 8s linear infinite}
    @keyframes la{0%{transform:rotate(0)}15.0%{transform:rotate(0deg)}18.8%{transform:rotate(28deg)}22.5%{transform:rotate(-28deg)}26.2%{transform:rotate(28deg)}30.0%{transform:rotate(0deg)}45.0%{transform:rotate(0deg)}48.8%{transform:rotate(28deg)}52.5%{transform:rotate(-28deg)}56.2%{transform:rotate(28deg)}60.0%{transform:rotate(0deg)}70.0%{transform:rotate(0deg)}73.8%{transform:rotate(28deg)}77.5%{transform:rotate(-28deg)}81.2%{transform:rotate(28deg)}85.0%{transform:rotate(0deg)}100%{transform:rotate(0)}}
    @keyframes lb{0%{transform:rotate(0)}15.0%{transform:rotate(0deg)}18.8%{transform:rotate(-28deg)}22.5%{transform:rotate(28deg)}26.2%{transform:rotate(-28deg)}30.0%{transform:rotate(0deg)}45.0%{transform:rotate(0deg)}48.8%{transform:rotate(-28deg)}52.5%{transform:rotate(28deg)}56.2%{transform:rotate(-28deg)}60.0%{transform:rotate(0deg)}70.0%{transform:rotate(0deg)}73.8%{transform:rotate(-28deg)}77.5%{transform:rotate(28deg)}81.2%{transform:rotate(-28deg)}85.0%{transform:rotate(0deg)}100%{transform:rotate(0)}}
    .tail{transform-box:fill-box;transform-origin:100% 100%;animation:tl 2.6s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(8deg)}}
    .scarf{transform-box:fill-box;transform-origin:100% 50%;animation:sc 1.2s ease-in-out infinite}
    @keyframes sc{0%,100%{transform:rotate(-6deg) scaleX(1)}50%{transform:rotate(7deg) scaleX(.9)}}
    .eye{transform-box:fill-box;transform-origin:50% 50%;animation:bl 5s infinite}
    @keyframes bl{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    .rp{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
    .r0{animation:rp0 8s ease-out infinite} .r1{animation:rp1 8s ease-out infinite} .r2{animation:rp2 8s ease-out infinite} .r3{animation:rp3 8s ease-out infinite}
    @keyframes rp0{0%,2%{transform:scale(.3);opacity:.9}14%,100%{transform:scale(1.2);opacity:0}}
    @keyframes rp1{0%,29%{transform:scale(.3);opacity:0}30%{transform:scale(.3);opacity:.9}44%,100%{transform:scale(1.2);opacity:0}}
    @keyframes rp2{0%,59%{transform:scale(.3);opacity:0}60%{transform:scale(.3);opacity:.9}74%,100%{transform:scale(1.2);opacity:0}}
    @keyframes rp3{0%,84%{transform:scale(.3);opacity:0}85%{transform:scale(.3);opacity:.9}99%,100%{transform:scale(1.2);opacity:0}}
    .s1{animation:g1 8s linear infinite} .s2{animation:g2 8s linear infinite} .s3{animation:g3 8s linear infinite}
    @keyframes g1{0%,29%{fill:#9ca3af}31%,50%{fill:#fbbf24}70%,100%{fill:#9ca3af}}
    @keyframes g2{0%,59%{fill:#9ca3af}61%,78%{fill:#fbbf24}95%,100%{fill:#9ca3af}}
    @keyframes g3{0%,84%{fill:#9ca3af}86%,93%{fill:#fbbf24}99%,100%{fill:#9ca3af}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
