  <g class="m2" fill="#bfdbfe" opacity=".8"><polygon points="-260,120 -190,88 -130,120" /><polygon points="40,120 110,88 170,120" /><polygon points="340,120 410,88 470,120" /><polygon points="640,120 710,88 770,120" /><polygon points="940,120 1010,88 1070,120" /><polygon points="1240,120 1310,88 1370,120" /></g>
  <text x="340" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="56" letter-spacing="1" fill="#0c4a6e">一歩を踏み出す</text>
  <rect y="136" width="1200" height="14" fill="url(#wt)"/>
  <g class="w1" fill="none" stroke="#e0f2fe" stroke-width="1.6" opacity=".8"><path d="M -60 138 q 15 -5 30 0 t 30 0" /><path d="M 0 138 q 15 -5 30 0 t 30 0" /><path d="M 60 138 q 15 -5 30 0 t 30 0" /><path d="M 120 138 q 15 -5 30 0 t 30 0" /><path d="M 180 138 q 15 -5 30 0 t 30 0" /><path d="M 240 138 q 15 -5 30 0 t 30 0" /><path d="M 300 138 q 15 -5 30 0 t 30 0" /><path d="M 360 138 q 15 -5 30 0 t 30 0" /><path d="M 420 138 q 15 -5 30 0 t 30 0" /><path d="M 480 138 q 15 -5 30 0 t 30 0" /><path d="M 540 138 q 15 -5 30 0 t 30 0" /><path d="M 600 138 q 15 -5 30 0 t 30 0" /><path d="M 660 138 q 15 -5 30 0 t 30 0" /><path d="M 720 138 q 15 -5 30 0 t 30 0" /><path d="M 780 138 q 15 -5 30 0 t 30 0" /><path d="M 840 138 q 15 -5 30 0 t 30 0" /><path d="M 900 138 q 15 -5 30 0 t 30 0" /><path d="M 960 138 q 15 -5 30 0 t 30 0" /><path d="M 1020 138 q 15 -5 30 0 t 30 0" /><path d="M 1080 138 q 15 -5 30 0 t 30 0" /><path d="M 1140 138 q 15 -5 30 0 t 30 0" /><path d="M 1200 138 q 15 -5 30 0 t 30 0" /><path d="M 1260 138 q 15 -5 30 0 t 30 0" /></g>
  <g class="w2" fill="none" stroke="#7dd3fc" stroke-width="1.6" opacity=".8" transform="translate(0,6)"><path d="M -60 138 q 15 -5 30 0 t 30 0" /><path d="M 0 138 q 15 -5 30 0 t 30 0" /><path d="M 60 138 q 15 -5 30 0 t 30 0" /><path d="M 120 138 q 15 -5 30 0 t 30 0" /><path d="M 180 138 q 15 -5 30 0 t 30 0" /><path d="M 240 138 q 15 -5 30 0 t 30 0" /><path d="M 300 138 q 15 -5 30 0 t 30 0" /><path d="M 360 138 q 15 -5 30 0 t 30 0" /><path d="M 420 138 q 15 -5 30 0 t 30 0" /><path d="M 480 138 q 15 -5 30 0 t 30 0" /><path d="M 540 138 q 15 -5 30 0 t 30 0" /><path d="M 600 138 q 15 -5 30 0 t 30 0" /><path d="M 660 138 q 15 -5 30 0 t 30 0" /><path d="M 720 138 q 15 -5 30 0 t 30 0" /><path d="M 780 138 q 15 -5 30 0 t 30 0" /><path d="M 840 138 q 15 -5 30 0 t 30 0" /><path d="M 900 138 q 15 -5 30 0 t 30 0" /><path d="M 960 138 q 15 -5 30 0 t 30 0" /><path d="M 1020 138 q 15 -5 30 0 t 30 0" /><path d="M 1080 138 q 15 -5 30 0 t 30 0" /><path d="M 1140 138 q 15 -5 30 0 t 30 0" /><path d="M 1200 138 q 15 -5 30 0 t 30 0" /><path d="M 1260 138 q 15 -5 30 0 t 30 0" /></g>
  <ellipse class="rp r0" cx="800" cy="141" rx="34" ry="5" fill="none" stroke="#e0f2fe" stroke-width="2"/><ellipse class="rp r1" cx="900" cy="141" rx="34" ry="5" fill="none" stroke="#e0f2fe" stroke-width="2"/><ellipse class="rp r2" cx="1000" cy="141" rx="34" ry="5" fill="none" stroke="#e0f2fe" stroke-width="2"/><ellipse class="rp r3" cx="1100" cy="141" rx="34" ry="5" fill="none" stroke="#e0f2fe" stroke-width="2"/>
  <ellipse class="stone s0" cx="800" cy="132" rx="28" ry="7" fill="#9ca3af"/><ellipse cx="800" cy="128.5" rx="26" ry="4.5" fill="#cbd5e1"/><ellipse class="stone s1" cx="900" cy="132" rx="28" ry="7" fill="#9ca3af"/><ellipse cx="900" cy="128.5" rx="26" ry="4.5" fill="#cbd5e1"/><ellipse class="stone s2" cx="1000" cy="132" rx="28" ry="7" fill="#9ca3af"/><ellipse cx="1000" cy="128.5" rx="26" ry="4.5" fill="#cbd5e1"/><ellipse class="stone s3" cx="1100" cy="132" rx="28" ry="7" fill="#9ca3af"/><ellipse cx="1100" cy="128.5" rx="26" ry="4.5" fill="#cbd5e1"/>
  <g class="cat"><g transform="scale(1.25)">
    <g class="tail"><path d="M -18 -19 Q -34 -20 -32 -36 Q -31 -44 -25 -43" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/></g>
    <rect class="lgB" x="-15" y="-12" width="4.5" height="12" rx="2.2" fill="#111827"/>
    <rect class="lgA" x="-8" y="-12" width="4.5" height="12" rx="2.2" fill="#1f2937"/>
    <rect class="lgA" x="9" y="-12" width="4.5" height="12" rx="2.2" fill="#111827"/>
    <rect class="lgB" x="16" y="-12" width="4.5" height="12" rx="2.2" fill="#1f2937"/>
