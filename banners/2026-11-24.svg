<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .arm{transform-box:view-box;transform-origin:0px 0px;animation:arm 8s ease-in-out infinite}
    @keyframes arm{0%,12%{transform:rotate(95deg)}24%,40%{transform:rotate(125deg)}52%,100%{transform:rotate(95deg)}}
    .pot{transform-box:view-box;transform-origin:0px 52px;animation:pot 8s ease-in-out infinite}
    @keyframes pot{0%,26%{transform:rotate(0)}32%,38%{transform:rotate(-17deg)}44%,100%{transform:rotate(0)}}
    .stream{transform-box:fill-box;transform-origin:50% 0%;animation:st 8s ease-in-out infinite;opacity:0}
    @keyframes st{0%,30%{opacity:0;transform:scaleY(0)}33%{opacity:1;transform:scaleY(1)}39%{opacity:1;transform:scaleY(1)}42%,100%{opacity:0;transform:scaleY(0)}}
    .tea{transform-box:fill-box;transform-origin:50% 100%;animation:te 8s linear infinite}
    @keyframes te{0%,32%{transform:scaleY(0)}41%,92%{transform:scaleY(1)}98%,100%{transform:scaleY(0)}}
    .hd{transform-box:fill-box;transform-origin:70% 100%;animation:hd 8s ease-in-out infinite}
    @keyframes hd{0%,18%{transform:rotate(0)}28%,40%{transform:rotate(-8deg)}52%{transform:rotate(0)}62%,80%{transform:rotate(-26deg)}92%,100%{transform:rotate(0)}}
    .steam{animation:sm 3s ease-in-out infinite;opacity:0}
    .sm2{animation-delay:-1s} .sm3{animation-delay:-2s}
    @keyframes sm{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-22px);opacity:0}}
    .sg{animation:sg 8s linear infinite;opacity:0}
    @keyframes sg{0%,40%{opacity:0}46%,88%{opacity:1}94%,100%{opacity:0}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 3.6s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(0)}40%{transform:rotate(7deg)}60%{transform:rotate(-3deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:er 7s ease-in-out infinite}
    @keyframes er{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}95%{transform:rotate(2deg)}}
    .eye{transform-box:fill-box;transform-origin:50% 50%;animation:bl 5s infinite}
    @keyframes bl{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    .sp{transform-box:fill-box;transform-origin:50% 50%;animation:sp 8s ease-out infinite;opacity:0}
    @keyframes sp{0%,70%{transform:scale(0);opacity:0}76%{transform:scale(1.3);opacity:1}88%,100%{transform:scale(.5);opacity:0}}
    .sun{animation:sn 7s ease-in-out infinite}
    @keyframes sn{0%,100%{opacity:.35}50%{opacity:.7}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe0"/><stop offset="1" stop-color="#efe4c8"/></linearGradient>
    <clipPath id="cup"><path d="M 1060 98 L 1082 98 Q 1082 110 1071 110 Q 1060 110 1060 98 Z"/></clipPath>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <rect x="740" y="18" width="93" height="94" fill="#fff9e6"/>
  <polygon class="sun" points="740,18 833,18 833,60 790,112 740,112" fill="#fde68a" opacity=".5"/>
  <g><line x1="740" y1="18" x2="740" y2="112" stroke="#8b6b45" stroke-width="2"/><line x1="771" y1="18" x2="771" y2="112" stroke="#8b6b45" stroke-width="2"/><line x1="802" y1="18" x2="802" y2="112" stroke="#8b6b45" stroke-width="2"/><line x1="833" y1="18" x2="833" y2="112" stroke="#8b6b45" stroke-width="2"/><line x1="740" y1="18" x2="833" y2="18" stroke="#8b6b45" stroke-width="2"/><line x1="740" y1="49" x2="833" y2="49" stroke="#8b6b45" stroke-width="2"/><line x1="740" y1="80" x2="833" y2="80" stroke="#8b6b45" stroke-width="2"/><line x1="740" y1="112" x2="833" y2="112" stroke="#8b6b45" stroke-width="2"/></g>
  <text x="340" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="56" letter-spacing="1" fill="#2f4f3a">礼を尽くす</text>
  <rect y="124" width="1200" height="26" fill="#d9cba0"/><line x1="0" y1="124" x2="0" y2="150" stroke="#c9b98a" stroke-width="1.2"/><line x1="150" y1="124" x2="150" y2="150" stroke="#c9b98a" stroke-width="1.2"/><line x1="300" y1="124" x2="300" y2="150" stroke="#c9b98a" stroke-width="1.2"/><line x1="450" y1="124" x2="450" y2="150" stroke="#c9b98a" stroke-width="1.2"/><line x1="600" y1="124" x2="600" y2="150" stroke="#c9b98a" stroke-width="1.2"/><line x1="750" y1="124" x2="750" y2="150" stroke="#c9b98a" stroke-width="1.2"/><line x1="900" y1="124" x2="900" y2="150" stroke="#c9b98a" stroke-width="1.2"/><line x1="1050" y1="124" x2="1050" y2="150" stroke="#c9b98a" stroke-width="1.2"/><line x1="0" y1="131" x2="1200" y2="131" stroke="#d3c493" stroke-width="1"/><line x1="0" y1="138" x2="1200" y2="138" stroke="#d3c493" stroke-width="1"/><line x1="0" y1="145" x2="1200" y2="145" stroke="#d3c493" stroke-width="1"/>
  <rect y="124" width="1200" height="3" fill="#8b6b45"/>
  <!-- low table -->
  <rect x="1020" y="115" width="6" height="15" fill="#8b5e34"/><rect x="1096" y="115" width="6" height="15" fill="#8b5e34"/>
  <rect x="1012" y="110" width="98" height="6" rx="2" fill="#a9743f"/>
  <!-- cat -->
  <g transform="translate(1138,130) scale(.9)">
    <g class="tail"><path d="M 24 -6 Q 52 -6 50 -32 Q 49 -46 41 -44" fill="none" stroke="#c2763a" stroke-width="8" stroke-linecap="round"/></g>
    <ellipse cx="6" cy="-26" rx="21" ry="27" fill="#fff3e0" transform="rotate(-8 6 -26)"/>
    <ellipse cx="-3" cy="-22" rx="8" ry="14" fill="#ffffff"/>
    <g class="hd">
      <polygon points="-26,-70 -24,-88 -13,-74" fill="#e0975a"/>
      <g class="ear"><polygon points="-9,-74 -2,-86 4,-68" fill="#e0975a"/></g>
      <circle cx="-12" cy="-60" r="16" fill="#fff3e0"/>
      <ellipse cx="-17" cy="-61" rx="9" ry="9" fill="#e0975a" opacity=".55"/>
      <ellipse cx="-23" cy="-55" rx="7" ry="5.5" fill="#e0975a"/>
      <circle cx="-29" cy="-57" r="2" fill="#f472b6"/>
      <g class="eye"><ellipse cx="-19" cy="-62" rx="2.5" ry="3.3" fill="#38bdf8"/><ellipse cx="-19.5" cy="-62" rx="1.1" ry="2.7" fill="#0c0a09"/></g>
      <g stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"><path d="M -23 -55 L -6 -50"/><path d="M -23 -57 L -4 -57"/><path d="M -23 -59 L -6 -64"/></g>
    </g>
    <g transform="translate(-12,-27)"><g class="arm">
      <rect x="-4.5" y="0" width="9" height="52" rx="4.5" fill="#e0975a"/>
      <g class="pot">
        <ellipse cx="0" cy="56" rx="10" ry="9" fill="#6b8f71"/>
        <ellipse cx="0" cy="56" rx="10" ry="9" fill="none" stroke="#4b6b52" stroke-width="1.4"/>
        <rect x="-5" y="46" width="10" height="3" rx="1.5" fill="#4b6b52"/>
        <circle cx="-7" cy="56" r="0" fill="none"/>
        <path d="M -7 48 Q -18 54 -7 62" fill="none" stroke="#4b6b52" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M 6 52 L 10 66" stroke="#6b8f71" stroke-width="3.6" stroke-linecap="round"/>
        <circle cx="0" cy="45" r="2" fill="#f5f5f4"/>
      </g>
      <ellipse cx="0" cy="52" rx="5.5" ry="4.5" fill="#ffffff"/>
    </g></g>
  </g>
  <!-- cup -->
  <path d="M 1060 98 L 1082 98 Q 1082 110 1071 110 Q 1060 110 1060 98 Z" fill="#fff7ed"/>
  <g clip-path="url(#cup)"><rect class="tea" x="1058" y="100" width="26" height="11" fill="#84cc16"/></g>
  <path d="M 1060 98 L 1082 98 Q 1082 110 1071 110 Q 1060 110 1060 98 Z" fill="none" stroke="#9a6b3c" stroke-width="1.4"/>
  <g class="steam"><path d="M 1066 94 q -3 -5 0 -9 q 3 -5 0 -9" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/></g>
  <g class="steam sm2"><path d="M 1072 94 q 3 -5 0 -9 q -3 -5 0 -9" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/></g>
  <g class="steam sm3"><path d="M 1077 94 q -3 -5 0 -9 q 3 -5 0 -9" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/></g>
  <!-- tea stream (world coords, tip of spout) -->
  <g class="stream"><rect x="1069" y="80" width="2.4" height="18" fill="#84cc16"/></g>
  <g class="sg"><path d="M 1052 70 l 2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#fbbf24"/></g>
  <g class="sp"><path d="M 1100 80 l 2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#f59e0b"/></g>
</svg>
