    <ellipse cx="-6" cy="-22" rx="9" ry="6" fill="#f97316"/><ellipse cx="11" cy="-17" rx="6" ry="5" fill="#f97316"/>
    <polygon points="17,-34 19,-45 25,-37" fill="#27272a"/><polygon points="26,-36 33,-44 33,-32" fill="#f97316"/>
    <circle cx="26" cy="-28" r="10" fill="#3f3f46"/>
    <path d="M 26 -38 Q 36 -36 36 -26 Q 31 -24 26 -28 Z" fill="#f97316"/>
    <ellipse cx="34" cy="-25" rx="4" ry="3" fill="#fde7c7"/>
    <circle cx="37.5" cy="-26" r="1.3" fill="#f472b6"/>
    <g class="eye"><ellipse cx="30.5" cy="-30" rx="2.4" ry="3" fill="#84cc16"/><ellipse cx="31" cy="-30" rx="1" ry="2.5" fill="#000"/></g>
    <g stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"><path d="M 34 -24 L 44 -21"/><path d="M 34 -25.5 L 45 -26"/><path d="M 34 -27 L 44 -31"/></g>
    <g class="scarf"><path d="M 14 -26 Q 4 -21 -4 -27 L -6 -23 Q 4 -15 15 -21 Z" fill="#38bdf8"/></g>
    </g>
  </g></g>
  <g transform="translate(1040,22) scale(1.5)"><g class="bulb"><g class="rays" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round"><path d="M -10 -6 L -14 -8 M 10 -6 L 14 -8 M 0 -13 L 0 -17"/></g><circle cx="0" cy="-4" r="6" fill="#fde047" stroke="#f59e0b" stroke-width="1.2"/><rect x="-3" y="1" width="6" height="4" rx="1" fill="#9ca3af"/></g></g>
