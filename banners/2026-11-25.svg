  <g class="ride"><g transform="translate(1010,66) rotate(8)">
    <g transform="translate(-30,5)"><g><circle class="sp" style="animation-delay:0s" cx="0" cy="0" r="2.2" fill="#ffffff"/><circle class="sp" style="animation-delay:-0.5s" cx="0" cy="0" r="1.6" fill="#ffffff"/><circle class="sp" style="animation-delay:-1s" cx="0" cy="0" r="2.6" fill="#ffffff"/><circle class="sp" style="animation-delay:-1.5s" cx="0" cy="0" r="1.8" fill="#ffffff"/></g></g>
    <rect x="-34" y="0" width="68" height="5" rx="2.5" fill="#fb7185"/><rect x="-34" y="0" width="68" height="2" rx="1" fill="#fecdd3"/>
    <g transform="scale(1.15)">
    <g class="tail"><path d="M -18 -19 Q -34 -20 -32 -36 Q -31 -44 -25 -43" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/></g>
