<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .s1{animation:ss 7s linear infinite} .s2{animation:ss 4.5s linear infinite} .s3{animation:ss 3s linear infinite}
    @keyframes ss{from{transform:translateX(0)}to{transform:translateX(-240px)}}
    .card{animation-name:cd;animation-timing-function:linear;animation-iteration-count:infinite;opacity:0}
    @keyframes cd{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(-470px);opacity:0}}
    .bob{animation:bb 2.6s ease-in-out infinite}
    @keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .ride{transform-box:view-box;transform-origin:1010px 70px;animation:rd 2.6s ease-in-out infinite}
    @keyframes rd{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    .tail{transform-box:fill-box;transform-origin:100% 100%;animation:tl 1.4s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
    .scarf{transform-box:fill-box;transform-origin:100% 50%;animation:sc 1s ease-in-out infinite}
    @keyframes sc{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
    .eye{transform-box:fill-box;transform-origin:50% 50%;animation:bl 5s infinite}
    @keyframes bl{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    .foam{stroke-dasharray:8 6;animation:fm 1.2s linear infinite}
    @keyframes fm{to{stroke-dashoffset:-14}}
    .sp{animation:spr 1.6s ease-out infinite;opacity:0}
    @keyframes spr{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(-34px,-22px);opacity:0}}
    .bulb{transform-box:fill-box;transform-origin:50% 100%;animation:bu 8s ease-out infinite;opacity:0}
    @keyframes bu{0%,54%{transform:scale(0);opacity:0}60%{transform:scale(1.2);opacity:1}64%,78%{transform:scale(1);opacity:1}86%,100%{transform:scale(.6);opacity:0}}
    .rays{animation:ry .5s ease-in-out infinite}
    @keyframes ry{0%,100%{opacity:.4}50%{opacity:1}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#fef08a"/></linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <circle cx="1150" cy="36" r="30" fill="#fde047" opacity=".35"/><circle cx="1150" cy="36" r="17" fill="#fde047"/>
  <g class="card" style="animation-duration:9s;animation-delay:0s"><g transform="translate(1180,14)"><rect width="24" height="17" rx="3" fill="#ffffff" stroke="#e2e8f0"/><rect width="24" height="5" rx="2.5" fill="#fb7185"/><rect x="3" y="8" width="14" height="1.6" rx=".8" fill="#94a3b8"/><rect x="3" y="12" width="9" height="1.6" rx=".8" fill="#94a3b8"/></g></g><g class="card" style="animation-duration:11s;animation-delay:-3s"><g transform="translate(1180,34)"><rect width="24" height="17" rx="3" fill="#ffffff" stroke="#e2e8f0"/><rect width="24" height="5" rx="2.5" fill="#fbbf24"/><rect x="3" y="8" width="14" height="1.6" rx=".8" fill="#94a3b8"/><rect x="3" y="12" width="9" height="1.6" rx=".8" fill="#94a3b8"/></g></g><g class="card" style="animation-duration:10s;animation-delay:-6s"><g transform="translate(1180,48)"><rect width="24" height="17" rx="3" fill="#ffffff" stroke="#e2e8f0"/><rect width="24" height="5" rx="2.5" fill="#a3e635"/><rect x="3" y="8" width="14" height="1.6" rx=".8" fill="#94a3b8"/><rect x="3" y="12" width="9" height="1.6" rx=".8" fill="#94a3b8"/></g></g><g class="card" style="animation-duration:12s;animation-delay:-8s"><g transform="translate(1180,22)"><rect width="24" height="17" rx="3" fill="#ffffff" stroke="#e2e8f0"/><rect width="24" height="5" rx="2.5" fill="#a78bfa"/><rect x="3" y="8" width="14" height="1.6" rx=".8" fill="#94a3b8"/><rect x="3" y="12" width="9" height="1.6" rx=".8" fill="#94a3b8"/></g></g><g class="card" style="animation-duration:13s;animation-delay:-1.5s"><g transform="translate(1180,42)"><rect width="24" height="17" rx="3" fill="#ffffff" stroke="#e2e8f0"/><rect width="24" height="5" rx="2.5" fill="#38bdf8"/><rect x="3" y="8" width="14" height="1.6" rx=".8" fill="#94a3b8"/><rect x="3" y="12" width="9" height="1.6" rx=".8" fill="#94a3b8"/></g></g>
  <text x="340" y="75" dominant-baseline="central" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-weight="900" font-size="52" letter-spacing="1" fill="#134e4a">情報収集で波に乗る</text>
