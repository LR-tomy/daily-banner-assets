.bulb{animation:bulb 9s linear infinite;opacity:0}
@keyframes pulse{0%{transform:scale(.85)}50%{transform:scale(1.15)}100%{transform:scale(.85)}}
.pulse{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%{transform:scale(.3);opacity:.3}50%{transform:scale(1.2);opacity:1}100%{transform:scale(.3);opacity:.3}}
.tw{animation:tw 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.tw2{animation-delay:-.4s}.tw3{animation-delay:-.8s}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
