<style>
@keyframes arm{0%{transform:rotate(8.58deg) scale(1.17,1)}8.33%{transform:rotate(12.46deg) scale(1.16,1)}16.67%{transform:rotate(15.86deg) scale(1.12,1)}25%{transform:rotate(18.06deg) scale(1.05,1)}33.33%{transform:rotate(18.31deg) scale(0.97,1)}41.67%{transform:rotate(16.06deg) scale(0.9,1)}50%{transform:rotate(11.59deg) scale(0.87,1)}58.33%{transform:rotate(6.43deg) scale(0.87,1)}66.67%{transform:rotate(2.61deg) scale(0.92,1)}75%{transform:rotate(1.25deg) scale(1,1)}83.33%{transform:rotate(2.24deg) scale(1.08,1)}91.67%{transform:rotate(4.94deg) scale(1.14,1)}100%{transform:rotate(8.58deg) scale(1.17,1)}}
.arm{animation:arm 1.2s linear infinite;transform-box:view-box;transform-origin:24px -34px}
