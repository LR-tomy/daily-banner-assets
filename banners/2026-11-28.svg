.hop{animation:hop 9s ease-in-out infinite}
@keyframes eo{0%{opacity:1}71.9%{opacity:1}72%{opacity:0}93.9%{opacity:0}94%{opacity:1}100%{opacity:1}}
@keyframes eh{0%{opacity:0}71.9%{opacity:0}72%{opacity:1}93.9%{opacity:1}94%{opacity:0}100%{opacity:0}}
